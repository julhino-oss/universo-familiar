<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23171335'/%3E%3Ccircle cx='42' cy='40' r='26' fill='%23f4b740'/%3E%3Cellipse cx='42' cy='40' rx='38' ry='9' fill='none' stroke='%23f4b740' stroke-width='3' opacity='0.6' transform='rotate(-15 42 40)'/%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Universo%20Familiar%22%2C%22short_name%22%3A%22Universo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23171335%22%2C%22theme_color%22%3A%22%23171335%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171335;
    --bg-deep: #100d26;
    --card: #241f4c;
    --card-hi: #2e2861;
    --gold: #f4b740;
    --coral: #ff6f5b;
    --text: #f5f1ff;
    --muted: #9c93c4;
    --line: #3a3470;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 700px 500px at 15% -5%, rgba(255,111,91,0.16) 0%, transparent 60%),
      radial-gradient(ellipse 600px 600px at 90% 15%, rgba(196,140,255,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 800px 700px at 50% 100%, rgba(77,208,225,0.10) 0%, transparent 60%),
      radial-gradient(circle at 20% -10%, #241f5c 0%, var(--bg-deep) 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Sora', system-ui, -apple-system, sans-serif;
    position: relative;
  }
  .stars-layer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars-layer::before, .stars-layer::after {
    content: "";
    position: absolute; inset: 0;
    background-repeat: repeat;
    background-image:
      radial-gradient(1.4px 1.4px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 90px 80px, #fff, transparent),
      radial-gradient(1.6px 1.6px at 150px 20px, #fff, transparent),
      radial-gradient(1px 1px at 60px 140px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 180px 120px, #fff, transparent),
      radial-gradient(1px 1px at 120px 170px, #fff, transparent);
    background-size: 220px 200px;
    opacity: 0.5;
    animation: twinkle 5s ease-in-out infinite;
  }
  .stars-layer::after {
    background-size: 300px 280px;
    background-position: 40px 60px;
    opacity: 0.3;
    animation: twinkle 7s ease-in-out infinite reverse;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) {
    .stars-layer::before, .stars-layer::after { animation: none; }
  }
  body {
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
  }
  .wrap { width: 100%; max-width: 480px; position: relative; z-index: 1; }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .title { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 8px; }

  /* ---- Home: profile planets ---- */
  .home-header { margin-bottom: 24px; }
  .planet-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 20px;
  }
  .planet-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(8,6,24,0.35);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .planet-card:hover { transform: translateY(-3px); background: var(--card-hi); box-shadow: 0 10px 22px rgba(8,6,24,0.45); }
  .planet-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 6px 14px rgba(8,6,24,0.4);
  }
  .planet-avatar svg { width: 100%; height: 100%; }
  .planet-name { font-weight: 600; font-size: 15px; }
  .planet-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .add-card {
    border: 1.5px dashed var(--line);
    background: transparent;
    border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted);
    cursor: pointer;
    min-height: 116px;
    font-size: 13px;
    gap: 6px;
  }
  .add-card:hover { border-color: var(--gold); color: var(--gold); }
  .add-plus { font-size: 26px; font-family: 'Fraunces', serif; }

  /* ---- Profile view ---- */
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .back-btn {
    background: none; border: none; color: var(--muted);
    font-size: 14px; cursor: pointer; padding: 6px 0;
  }
  .back-btn:hover { color: var(--text); }
  .streak-chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    display: flex; align-items: center; gap: 5px;
    box-shadow: 0 3px 10px rgba(8,6,24,0.3);
  }
  .profile-header { text-align: center; margin-bottom: 6px; }
  .sky-wrap {
    background: linear-gradient(180deg, #201a4a 0%, #14112f 100%);
    border-radius: 24px;
    border: 1px solid var(--line);
    padding: 8px;
    margin: 18px 0;
    overflow: hidden;
  }
  .progress-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); margin: 10px 4px 0;
  }
  .progress-bar { height: 6px; background: #2a2557; border-radius: 4px; overflow: hidden; margin: 8px 0 2px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--coral), var(--gold)); }

  button.cta {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--coral), #ff9060);
    color: #1c0e08;
    font-weight: 700;
    font-size: 15px;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
  }
  button.cta:active { transform: scale(0.98); }

  /* ---- Modal / overlay ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 8, 26, 0.72);
    backdrop-filter: blur(3px);
    display: flex; align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .sheet {
    background: #1c1846;
    border: 1px solid var(--line);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 480px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 22px 20px 28px;
    box-shadow: 0 -10px 34px rgba(0,0,0,0.45);
  }
  .sheet-close {
    display: block; margin: 0 0 12px auto;
    background: var(--card); border: none; color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 15px;
  }
  .cat-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .cat-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(8,6,24,0.25);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .cat-item:hover { background: var(--card-hi); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(8,6,24,0.35); }
  .cat-item-name { font-weight: 600; font-size: 14.5px; }
  .cat-item-count { color: var(--muted); font-size: 12px; }

  .topic-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 3px 10px rgba(8,6,24,0.25);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .topic-item:not(.learned):hover { background: var(--card-hi); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(8,6,24,0.35); }
  .topic-item.learned { opacity: 0.5; cursor: default; box-shadow: none; }
  .topic-star { font-size: 15px; }
  .topic-name { font-size: 14px; font-weight: 500; }

  .detail-card { text-align: left; }
  .detail-cat { color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .detail-title { font-size: 20px; margin: 8px 0 14px; }
  .detail-body { font-size: 14.5px; line-height: 1.6; color: #ded9f5; }

  input.name-input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: 'Sora', sans-serif;
    margin-top: 14px;
  }
  input.name-input:focus { outline: 2px solid var(--gold); }
  .swatch-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
  }
  .swatch.selected { border-color: white; }
  .empty-note { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 10px; }

  /* ---- Planet animation ---- */
  .planet-halo { animation: pulse-glow 4s ease-in-out infinite; transform-origin: 200px 130px; }
  .planet-band { animation: band-shift 26s linear infinite; transform-origin: 200px 130px; }
  .ring-outer { animation: band-shift 60s linear infinite reverse; transform-origin: 200px 130px; }
  .orbit-group { animation: orbit-spin 42s linear infinite; transform-origin: 200px 130px; }
  @keyframes pulse-glow { 0%,100% { opacity: .22; } 50% { opacity: .48; } }
  @keyframes band-shift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes orbit-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .planet-halo, .planet-band, .ring-outer, .orbit-group { animation: none; }
  }

  /* ---- Solar system view ---- */
  .solar-view {
    position: fixed; inset: 0;
    background: #05040c;
    overflow: hidden;
    z-index: 20;
    touch-action: none;
  }
  .solar-canvas, .solar-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .solar-svg { touch-action: none; }
  .solar-label {
    position: absolute;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-shadow: 0 1px 5px rgba(0,0,0,0.85);
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, 4px);
  }
  .solar-moon-label {
    position: absolute;
    color: var(--muted);
    font-family: 'Sora', sans-serif;
    font-size: 9px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.85);
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, 2px);
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .solar-star-label {
    position: absolute;
    color: var(--gold);
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  .solar-topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; z-index: 3;
  }
  .solar-btn {
    background: rgba(36,31,76,0.85); border: 1px solid var(--line); color: var(--text);
    font-family: 'Sora', sans-serif; font-size: 12.5px; padding: 9px 15px; border-radius: 20px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .solar-btn:hover { background: rgba(46,40,97,0.9); }
  .solar-bottombar {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, transparent, rgba(10,8,26,0.88) 35%, #0e0b24 75%);
    padding: 26px 18px 22px;
    z-index: 3;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .solar-view * { transition: none !important; }
  }
</style>
</head>

<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (app) {
    app.innerHTML = '<div style="background:#2e2861;border:1px solid #ff6f5b;border-radius:16px;padding:18px;margin-top:20px;font-family:sans-serif;font-size:13px;color:#f5f1ff;white-space:pre-wrap;">' +
      '<strong style="color:#ff6f5b;">Error detectado:</strong>\n' +
      (e.message || 'desconocido') + '\n' +
      'Línea: ' + (e.lineno || '?') + ', Columna: ' + (e.colno || '?') +
      '</div>';
  }
});
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script>
const TOPICS = [
  {id:"cn1",cat:"Ciencia y Naturaleza",title:"Qué es la cadena alimenticia",body:"Es el orden en que unos seres vivos se alimentan de otros: las plantas producen su propio alimento con el sol, los herbívoros comen plantas, y los carnívoros comen a otros animales. Si un eslabón desaparece, todos los demás se ven afectados."},
  {id:"cn2",cat:"Ciencia y Naturaleza",title:"Por qué truena y relampaguea",body:"Dentro de una tormenta, el aire se carga de electricidad y esa energía se libera de golpe como un rayo de luz: el relámpago. El trueno es el sonido que hace el aire al calentarse tan rápido con esa descarga; se ve primero porque la luz viaja más rápido que el sonido."},
  {id:"cn3",cat:"Ciencia y Naturaleza",title:"Cómo se forma un arcoíris",body:"Cuando el sol brilla mientras todavía hay gotitas de lluvia en el aire, la luz entra en cada gota y se separa en todos sus colores, como si la gota fuera un pequeño prisma. Por eso los arcoíris aparecen justo después de llover, con el sol detrás de ti."},
  {id:"cn4",cat:"Ciencia y Naturaleza",title:"Por qué las plantas necesitan el sol",body:"Las plantas usan la luz del sol como si fuera comida: la combinan con agua y aire para fabricar su propio alimento, en un proceso llamado fotosíntesis. Sin luz, no pueden producir la energía que necesitan para crecer."},
  {id:"cn5",cat:"Ciencia y Naturaleza",title:"Qué es la erosión",body:"Es el desgaste lento que el agua, el viento y el hielo le hacen a las rocas y la tierra con el paso del tiempo. Así se formaron muchos cañones y valles: no de un día para otro, sino durante miles o millones de años."},

  {id:"te1",cat:"Tecnología e IA",title:"Qué es internet",body:"Es una gigantesca red que conecta computadoras y celulares de todo el mundo entre sí, para que puedan enviarse información. Gracias a eso puedes video-llamar a alguien en otro país o ver una página web que está guardada en una computadora lejana."},
  {id:"te2",cat:"Tecnología e IA",title:"Por qué es importante una buena contraseña",body:"Una contraseña es como la llave de una casa digital: si es fácil de adivinar (como '1234'), cualquiera puede entrar a tus cuentas. Mientras más larga y menos obvia sea, más difícil es que alguien más la descubra."},
  {id:"te3",cat:"Tecnología e IA",title:"Qué es un algoritmo",body:"Es una lista de pasos ordenados para resolver algo, como una receta de cocina pero para una computadora. Cuando un mapa te dice el camino más corto, o una app te recomienda un video, están siguiendo un algoritmo por detrás."},
  {id:"te4",cat:"Tecnología e IA",title:"Qué es la realidad virtual",body:"Es una tecnología que, usando unos lentes especiales, te hace sentir que estás dentro de un mundo digital en vez de en el cuarto donde realmente estás. La computadora cambia lo que ves según hacia dónde mueves la cabeza, para que se sienta real."},
  {id:"te5",cat:"Tecnología e IA",title:"Por qué las computadoras usan solo 0 y 1",body:"Por dentro, una computadora funciona con pequeños interruptores eléctricos que solo pueden estar encendidos o apagados: eso es lo que representan el 1 y el 0. Combinando millones de esos encendidos y apagados a toda velocidad, la computadora puede representar textos, fotos y videos."},

  {id:"hi1",cat:"Historia y Culturas",title:"Qué fue la Ruta de la Seda",body:"Era un conjunto de caminos que conectaba Asia con Europa hace muchos siglos, por donde viajaban comerciantes vendiendo seda, especias y otras cosas. Además de productos, por esa ruta también viajaron ideas, inventos y costumbres entre culturas muy distintas."},
  {id:"hi2",cat:"Historia y Culturas",title:"Por qué existen tantos idiomas distintos",body:"Cuando los grupos de personas viven separados por montañas, mares o mucha distancia durante generaciones, su forma de hablar va cambiando de manera diferente en cada lugar. Con el tiempo, esos cambios se acumulan tanto que terminan siendo idiomas distintos."},
  {id:"hi3",cat:"Historia y Culturas",title:"Qué eran las civilizaciones antiguas como los mayas", body:"Eran sociedades muy organizadas que construyeron ciudades, estudiaron las estrellas y crearon su propio calendario y forma de escritura, mucho antes de que existiera la tecnología moderna. Muchos de sus templos y pirámides todavía se pueden visitar hoy."},
  {id:"hi4",cat:"Historia y Culturas",title:"Por qué las banderas representan a un país",body:"Una bandera es un símbolo que un país elige para que lo identifiquen de un vistazo, con colores y formas que suelen tener un significado especial para su historia. Por eso se le tiene tanto respeto: representa a todas las personas de ese lugar."},
  {id:"hi5",cat:"Historia y Culturas",title:"Cómo se inventó la escritura",body:"Hace miles de años, algunas civilizaciones antiguas empezaron a dibujar símbolos para llevar cuentas de cosechas y comercio, y esos dibujos poco a poco se convirtieron en letras. Fue uno de los inventos más importantes de la historia, porque permitió guardar el conocimiento para siempre."},

  {id:"cs1",cat:"Cuerpo y Salud",title:"Por qué nos enfermamos",body:"Todos los días, virus y bacterias intentan entrar a tu cuerpo, pero tienes un sistema de defensa llamado sistema inmunológico que los combate. Cuando te enfermas, es porque uno de esos invasores logró pasar, y tu cuerpo está trabajando para vencerlo."},
  {id:"cs2",cat:"Cuerpo y Salud",title:"Qué son las vacunas",body:"Una vacuna le enseña a tu sistema de defensa cómo reconocer y vencer a una enfermedad específica, sin que tengas que enfermarte de verdad primero. Así, si alguna vez te expones a esa enfermedad, tu cuerpo ya sabe cómo pelear contra ella."},
  {id:"cs3",cat:"Cuerpo y Salud",title:"Por qué es importante lavarse las manos",body:"Las manos tocan superficies llenas de gérmenes todo el día, y si luego te tocas la boca, la nariz o los ojos, esos gérmenes pueden entrar a tu cuerpo. Lavarlas con agua y jabón arrastra la mayoría de esos gérmenes antes de que puedan hacerte daño."},
  {id:"cs4",cat:"Cuerpo y Salud",title:"Qué hacen los pulmones",body:"Los pulmones toman el oxígeno del aire que respiras y lo pasan a la sangre, que lo reparte por todo tu cuerpo. Al mismo tiempo, sacan de tu cuerpo el dióxido de carbono que ya no necesitas, y lo expulsas cuando exhalas."},
  {id:"cs5",cat:"Cuerpo y Salud",title:"Por qué duelen los huesos cuando creces",body:"Cuando eres niño o adolescente, tus huesos están creciendo más rápido que en otras etapas de la vida, y ese estirón a veces produce una molestia llamada 'dolores de crecimiento'. No significa que algo esté mal, es simplemente tu cuerpo haciéndose más grande."},

  {id:"es1",cat:"Espacio y Universo",title:"Qué es un agujero negro",body:"Es una zona del espacio donde la gravedad es tan fuerte que ni siquiera la luz puede escapar de ella, por eso se ve completamente negra. Se forma cuando una estrella muy grande se colapsa sobre sí misma al final de su vida."},
  {id:"es2",cat:"Espacio y Universo",title:"Por qué las estrellas titilan",body:"Las estrellas en realidad brillan de forma constante, pero su luz tiene que atravesar toda la atmósfera de la Tierra antes de llegar a tus ojos, y el aire en movimiento la hace parpadear un poquito. Los planetas titilan menos porque se ven como un punto más grande de luz."},
  {id:"es3",cat:"Espacio y Universo",title:"Qué es la Vía Láctea",body:"Es la galaxia donde vivimos: un enorme grupo de miles de millones de estrellas, entre ellas nuestro Sol, unidas por la gravedad y girando lentamente en el espacio. En una noche muy oscura, se puede ver como una franja brumosa cruzando el cielo."},
  {id:"es4",cat:"Espacio y Universo",title:"Cómo se forman los cráteres de la Luna",body:"La Luna no tiene atmósfera que la proteja, así que cuando rocas del espacio (meteoritos) chocan contra su superficie a gran velocidad, dejan un hueco llamado cráter. Como no hay viento ni lluvia que los borre, esos cráteres pueden durar millones de años."},
  {id:"es5",cat:"Espacio y Universo",title:"Qué es un cometa",body:"Es una bola de hielo, polvo y roca que viaja alrededor del Sol en una órbita muy alargada. Cuando se acerca al Sol, el calor hace que parte de su hielo se convierta en gas y polvo, formando esa larga cola brillante que vemos desde la Tierra."},

  {id:"cu1",cat:"Curiosidades del Mundo",title:"Por qué los camaleones cambian de color",body:"Aunque mucha gente cree que lo hacen solo para esconderse, los camaleones cambian de color principalmente para comunicarse con otros camaleones y para regular su temperatura corporal. Un camaleón enojado o asustado puede volverse mucho más oscuro o brillante."},
  {id:"cu2",cat:"Curiosidades del Mundo",title:"Cuál es el animal más grande que ha existido",body:"La ballena azul, que vive hoy en nuestros océanos, es el animal más grande que se conoce en toda la historia de la Tierra, incluso más grande que los dinosaurios más enormes. Su corazón solo puede compararse en tamaño con un auto pequeño."},
  {id:"cu3",cat:"Curiosidades del Mundo",title:"Por qué los gatos ronronean",body:"Los gatos ronronean cuando están contentos, pero también lo hacen a veces cuando están heridos o nerviosos, porque esa vibración puede ayudar a calmarlos y hasta a sanar más rápido sus huesos y músculos. No siempre significa que estén felices."},
  {id:"cu4",cat:"Curiosidades del Mundo",title:"Cómo encuentran el camino las aves migratorias",body:"Muchas aves recorren miles de kilómetros cada año guiándose por el sol, las estrellas, y hasta por el campo magnético de la Tierra, que pueden sentir de una forma que los humanos no tenemos. Así logran volver al mismo lugar exacto año tras año."},
  {id:"cu5",cat:"Curiosidades del Mundo",title:"Por qué el chicle no se disuelve al masticarlo",body:"El chicle está hecho de una base de goma que no se deshace con la saliva, a diferencia del resto de sus ingredientes (como el azúcar y el sabor), que sí se disuelven poco a poco. Por eso, después de un rato, solo queda esa base sin sabor."},

  {id:"en1",cat:"Inglés",title:"Los colores en inglés",body:"'Red' es rojo, 'blue' es azul, 'yellow' es amarillo, 'green' es verde, y 'black' y 'white' son negro y blanco. Aprenderlos es más fácil si vas señalando objetos de esos colores mientras los dices en voz alta."},
  {id:"en2",cat:"Inglés",title:"Los días de la semana en inglés",body:"Empiezan con 'Sunday' (domingo) y siguen con 'Monday' (lunes), 'Tuesday' (martes), 'Wednesday' (miércoles), 'Thursday' (jueves), 'Friday' (viernes) y 'Saturday' (sábado). En inglés, la semana en el calendario suele empezar en domingo, no en lunes."},
  {id:"en3",cat:"Inglés",title:"Cómo pedir comida en inglés",body:"'I would like...' (me gustaría...) es una forma educada de pedir algo, como en 'I would like a water, please' (me gustaría un agua, por favor). También es muy útil 'Can I have...?' (¿me puede dar...?) para pedir algo de forma directa y amable."},
  {id:"en4",cat:"Inglés",title:"Cómo se forma el plural en inglés",body:"La mayoría de las palabras solo agregan una 's' al final, como 'cat' → 'cats' (gatos). Pero si la palabra termina en sonidos como 'ch', 'sh', 's' o 'x', se le agrega 'es', como en 'box' → 'boxes' (cajas)."},
  {id:"en5",cat:"Inglés",title:"Cómo decir la hora en inglés",body:"Para decir 'son las tres' dices 'it's three o'clock', y para 'las tres y media' dices 'it's half past three'. 'O'clock' se usa solo cuando es la hora exacta, sin minutos de más."},

  {id:"bi1",cat:"Versículos Bíblicos",title:"Génesis 1:1",body:"'En el principio creó Dios los cielos y la tierra.' Es el primer versículo de toda la Biblia, y presenta la idea de que todo lo que existe tuvo un comienzo y un creador."},
  {id:"bi2",cat:"Versículos Bíblicos",title:"Salmo 46:1",body:"'Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.' Habla de sentir que hay un lugar seguro al cual acudir cuando las cosas se ponen difíciles."},
  {id:"bi3",cat:"Versículos Bíblicos",title:"Mateo 7:12 (la Regla de Oro)",body:"'Así que, todas las cosas que queráis que los hombres hagan con vosotros, así también haced vosotros con ellos.' Es una de las enseñanzas más conocidas de toda la Biblia: tratar a los demás como te gustaría que te trataran a ti."},
  {id:"bi4",cat:"Versículos Bíblicos",title:"1 Corintios 13:4",body:"'El amor es paciente, es bondadoso. El amor no tiene envidia, no se jacta, no se envanece.' Es parte de una descripción muy conocida sobre cómo se ve el amor verdadero en la forma de actuar día a día."},

function hash(str) {
  let h = 0;
  for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return h;
}
function starPos(id) {
  const h1 = hash(id+"x"), h2 = hash(id+"y");
  return { x: 24 + (h1 % 352), y: 20 + (h2 % 190) };
}

const NASA_QUERIES = {
  mercurio: "Mercury planet", venus: "Venus planet", tierra: "Earth planet",
  marte: "Mars planet", jupiter: "Jupiter planet", saturno: "Saturn planet",
  urano: "Uranus planet", neptuno: "Neptune planet",
};
function loadPlanetPhotos() {
  try { return JSON.parse(localStorage.getItem('universo-familiar-planet-photos') || '{}'); }
  catch(e) { return {}; }
}
function savePlanetPhotos() {
  try { localStorage.setItem('universo-familiar-planet-photos', JSON.stringify(planetPhotoCache)); }
  catch(e) {}
  scheduleCloudSync();
}
let planetPhotoCache = loadPlanetPhotos();
let planetPhotoRequests = {};
function ensurePlanetPhoto(planetId) {
  if (!planetId || planetPhotoCache[planetId] || planetPhotoRequests[planetId]) return;
  const query = NASA_QUERIES[planetId];
  if (!query) return;
  planetPhotoRequests[planetId] = true;
  fetch(`https://images-api.nasa.gov/search?q=${encodeURIComponent(query)}&media_type=image&page_size=1`)
    .then(r => r.json())
    .then(data => {
      const href = data.collection && data.collection.items[0] && data.collection.items[0].links[0].href;
      if (href) {
        planetPhotoCache[planetId] = href;
        savePlanetPhotos();
        rerenderCurrentView();
      }
    })
    .catch(() => {});
}

function randomFamilyCode() {

  const n = Math.floor(1000 + Math.random()*9000);
  return w + n;

function loadStoredFamilyCode() {

function storeFamilyCode(code) {

function clearStoredFamilyCode() {

function familyDocRef(code) {
  return db.collection('families').doc(code);

function scheduleCloudSync() {
  if (!cloudEnabled || !db || !familyCode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    familyDocRef(familyCode).set({
      profiles: profiles,
      notes: notesStore,
      planetPhotos: planetPhotoCache,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true }).catch(() => { cloudBlocked = true; });
  }, 500);
}

  if (!cloudEnabled) { goLanding(); return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch(e) { cloudEnabled = false; renderHome(); return; }

  showLoadingScreen('Preparando tu universo...');
  firebase.auth().signInAnonymously().catch(() => {
    cloudEnabled = false; cloudBlocked = true; renderHome();
  });
  firebase.auth().onAuthStateChanged(user => {
    if (!user) return;
    const stored = loadStoredFamilyCode();
    if (stored) connectToFamily(stored);
    else renderFamilyGate();
  });
}

function showLoadingScreen(msg) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el(`<div style="text-align:center;padding:80px 10px;color:var(--muted);font-size:14px;">${msg}</div>`));
}

function connectToFamily(code) {
  familyCode = code;
  storeFamilyCode(code);
  showLoadingScreen('Conectando con tu familia...');
  if (familyUnsub) familyUnsub();
  hasLandedThisSession = false;
  familyUnsub = familyDocRef(code).onSnapshot(snap => {
    cloudBlocked = false;
    if (snap.exists) {
      const data = snap.data() || {};
      profiles = data.profiles || [];
      notesStore = data.notes || {};
      planetPhotoCache = data.planetPhotos || {};
      saveProfilesLocal(profiles);
      saveNotesLocal(notesStore);
    }
    if (!hasLandedThisSession) { hasLandedThisSession = true; goLanding(); }
    else rerenderCurrentView();
  }, () => {
    cloudBlocked = true;
    rerenderCurrentView();
  });
}

function leaveFamily() {
  if (familyUnsub) { familyUnsub(); familyUnsub = null; }
  teardownSolarIfActive();
  clearStoredFamilyCode();
  familyCode = null;
  currentProfileId = null;
  profiles = [];
  notesStore = {};
  hasLandedThisSession = false;
  renderFamilyGate();
}

function renderFamilyGate() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el(`
    <div class="home-header">
      <div class="eyebrow">Aprendizaje en familia</div>
      <h1 class="title">Universo Familiar</h1>

    </div>

      <div class="eyebrow">Ya tenemos código</div>

      <button class="cta" id="joinBtn">Entrar</button>
      <div id="joinError" style="color:var(--coral);font-size:12.5px;margin-top:10px;display:none;"></div>
    </div>
  `);

  const createBtn = el(`<button class="cta" style="background:transparent;border:1px solid var(--line);color:var(--text);">✨ Crear código nuevo para mi familia</button>`);
  app.appendChild(createBtn);

  const input = joinCard.querySelector('#joinCodeInput');
  const errorBox = joinCard.querySelector('#joinError');
  joinCard.querySelector('#joinBtn').onclick = () => {
    const code = input.value.trim().toUpperCase().replace(/\s+/g,'');

      if (snap.exists) {

      } else {
        errorBox.textContent = 'No encontramos ese código. Revisa que esté bien escrito, o crea uno nuevo.';

    }).catch(() => {
      errorBox.textContent = 'No se pudo conectar. Revisa tu conexión a internet e intenta de nuevo.';
      errorBox.style.display = 'block';
    });

  createBtn.onclick = () => {

    if (attempt >= 6) { createBtn.disabled = false; return; }
    const code = randomFamilyCode();
    familyDocRef(code).get().then(snap => {

      familyDocRef(code).set({ profiles: [], notes: {}, planetPhotos: {}, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })

function buildPlanetAvatar(p) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.style.display = "block";
  const cx = 50, cy = 50, r = 38;
  const usePhoto = !!(p.realPlanetId && planetPhotoCache[p.realPlanetId]);

  const defs = document.createElementNS(ns,"defs");
  let fillRef;
  if (usePhoto) {
    const patId = "avpat-"+p.id;
    const pattern = document.createElementNS(ns,"pattern");
    pattern.setAttribute("id", patId);
    pattern.setAttribute("patternUnits","objectBoundingBox");
    pattern.setAttribute("width","1"); pattern.setAttribute("height","1");
    const image = document.createElementNS(ns,"image");
    image.setAttributeNS("http://www.w3.org/1999/xlink","href", planetPhotoCache[p.realPlanetId]);
    image.setAttribute("href", planetPhotoCache[p.realPlanetId]);
    image.setAttribute("x","0"); image.setAttribute("y","0");
    image.setAttribute("width","1"); image.setAttribute("height","1");
    image.setAttribute("preserveAspectRatio","xMidYMid slice");
    pattern.appendChild(image);
    defs.appendChild(pattern);
    fillRef = `url(#${patId})`;
  } else {
    const gradId = "avgrad-"+p.id;
    const grad = document.createElementNS(ns,"radialGradient");
    grad.setAttribute("id", gradId);
    grad.setAttribute("cx","35%"); grad.setAttribute("cy","32%"); grad.setAttribute("r","75%");
    grad.innerHTML = `<stop offset="0%" stop-color="#fff" stop-opacity="0.85"/><stop offset="35%" stop-color="${p.color}"/><stop offset="100%" stop-color="#241f4c"/>`;
    defs.appendChild(grad);
    fillRef = `url(#${gradId})`;
  }
  const shadeId = "avshade-"+p.id;
  const shadeGrad = document.createElementNS(ns,"radialGradient");
  shadeGrad.setAttribute("id", shadeId);
  shadeGrad.setAttribute("cx","72%"); shadeGrad.setAttribute("cy","75%"); shadeGrad.setAttribute("r","65%");
  shadeGrad.innerHTML = `<stop offset="0%" stop-color="#000" stop-opacity="0.5"/><stop offset="70%" stop-color="#000" stop-opacity="0.08"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>`;
  defs.appendChild(shadeGrad);
  svg.appendChild(defs);

  const learnedCount = (p.unlocked || []).length;
  if (p.forceRing || learnedCount >= 10) {
    const ring = document.createElementNS(ns,"ellipse");
    ring.setAttribute("cx",cx); ring.setAttribute("cy",cy);
    ring.setAttribute("rx", r+13); ring.setAttribute("ry", (r+13)*0.28);
    ring.setAttribute("fill","none"); ring.setAttribute("stroke", p.color);
    ring.setAttribute("stroke-opacity","0.5"); ring.setAttribute("stroke-width","2.5");
    svg.appendChild(ring);
  }

  const planet = document.createElementNS(ns,"circle");
  planet.setAttribute("cx",cx); planet.setAttribute("cy",cy); planet.setAttribute("r",r);
  planet.setAttribute("fill", fillRef);
  svg.appendChild(planet);

  if (!usePhoto) {
    const style = p.style || "bands";
    if (style === "bands") {
      const band = document.createElementNS(ns,"ellipse");
      band.setAttribute("cx",cx); band.setAttribute("cy",cy-5); band.setAttribute("rx", r); band.setAttribute("ry", r*0.22);
      band.setAttribute("fill","#fff"); band.setAttribute("opacity","0.10");
      svg.appendChild(band);
    } else if (style === "rocky") {
      [[-10,-8,3],[9,5,2.4],[-4,11,2]].forEach(([dx,dy,cr]) => {
        const c = document.createElementNS(ns,"circle");
        c.setAttribute("cx",cx+dx); c.setAttribute("cy",cy+dy); c.setAttribute("r",cr);
        c.setAttribute("fill","#000"); c.setAttribute("opacity","0.15");
        svg.appendChild(c);
      });
    } else if (style === "crystal") {
      for (let i=0;i<5;i++) {
        const angle = (i/5)*Math.PI*2;
        const line = document.createElementNS(ns,"line");
        line.setAttribute("x1",cx); line.setAttribute("y1",cy);
        line.setAttribute("x2", cx+Math.cos(angle)*r); line.setAttribute("y2", cy+Math.sin(angle)*r);
        line.setAttribute("stroke","#fff"); line.setAttribute("stroke-width","1"); line.setAttribute("opacity","0.2");
        svg.appendChild(line);
      }
    } else if (style === "lava") {
      const blob = document.createElementNS(ns,"ellipse");
      blob.setAttribute("cx",cx); blob.setAttribute("cy",cy); blob.setAttribute("rx", r*0.55); blob.setAttribute("ry", r*0.32);
      blob.setAttribute("fill","#fff2c2"); blob.setAttribute("opacity","0.18");
      svg.appendChild(blob);
    }
  }

  const shade = document.createElementNS(ns,"circle");
  shade.setAttribute("cx",cx); shade.setAttribute("cy",cy); shade.setAttribute("r",r);
  shade.setAttribute("fill", `url(#${shadeId})`);
  svg.appendChild(shade);

  const rim = document.createElementNS(ns,"circle");
  rim.setAttribute("cx",cx); rim.setAttribute("cy",cy); rim.setAttribute("r",r+0.5);
  rim.setAttribute("fill","none"); rim.setAttribute("stroke", p.color); rim.setAttribute("stroke-opacity","0.5"); rim.setAttribute("stroke-width","1");
  svg.appendChild(rim);

  return svg;
}

/* ---- Solar system view (Cambio 1: vista sistema familiar) ---- */
const prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let solarActive = false;
let solarRafId = null;
let solarPaused = false;
let solarSelectedId = null;
let solarClock = 0;
let solarLastTs = null;
let solarCam = { s: 1, tx: 0, ty: 0 };
let solarCamTarget = { s: 1, tx: 0, ty: 0 };
let solarPlanetsById = {};
let solarViewportW = 0, solarViewportH = 0;
let solarStarCtx = null;
let solarSceneEl = null, solarLabelsEl = null, solarOrbitsSvgEl = null;
let solarOnResize = null, solarOnVisibility = null;
let solarMoonEls = [];
let solarMoonsFor = null;
let solarBottomBarFor = null;
let hasLandedThisSession = false;

function goLanding() {
  if (profiles.length > 0) renderSolarSystem();
  else renderHome();
}

function teardownSolarIfActive() {
  if (!solarActive) return;
  solarActive = false;
  if (solarRafId) cancelAnimationFrame(solarRafId);
  solarRafId = null;
  if (solarOnResize) window.removeEventListener('resize', solarOnResize);
  if (solarOnVisibility) document.removeEventListener('visibilitychange', solarOnVisibility);
  solarOnResize = null; solarOnVisibility = null;
  solarPlanetsById = {};
  solarSelectedId = null;
  solarMoonEls = [];
  solarMoonsFor = null;
  solarBottomBarFor = null;
  solarLastTs = null;
}

function orbitParamsFor(profileId, index) {
  const h1 = hash(profileId+"-a"), h2 = hash(profileId+"-b"), h3 = hash(profileId+"-r"), h4 = hash(profileId+"-o"), h5 = hash(profileId+"-p");
  const a = 130 + index*68 + (h1 % 30);
  const b = a * (0.5 + (h2 % 20)/100);
  const rot = ((h3 % 360) * Math.PI/180) * 0.35;
  const angleOffset = (h4 % 360) * Math.PI/180;
  const period = 34 + (a/160)*26 + (h5 % 10);
  return { a, b, rot, angleOffset, period };
}

function planetPositionAt(orb, t) {
  const angle = orb.angleOffset + (prefersReducedMotion ? 0 : (t / orb.period) * Math.PI * 2);
  const x0 = Math.cos(angle) * orb.a;
  const y0 = Math.sin(angle) * orb.b;
  const cosR = Math.cos(orb.rot), sinR = Math.sin(orb.rot);
  return {
    x: 500 + x0*cosR - y0*sinR,
    y: 500 + x0*sinR + y0*cosR,
  };
}

function syncSolarPlanets() {
  if (!solarSceneEl) return;
  const seen = {};
  profiles.forEach((rawP, i) => {
    const p = ensureProfileDefaults(rawP);
    if (p.realPlanetId) ensurePlanetPhoto(p.realPlanetId);
    seen[p.id] = true;
    let entry = solarPlanetsById[p.id];
    if (!entry) {
      const orb = orbitParamsFor(p.id, i);
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:0;top:0;width:64px;height:64px;cursor:pointer;';
      solarSceneEl.appendChild(wrap);
      const label = document.createElement('div');
      label.className = 'solar-label';
      solarLabelsEl.appendChild(label);
      const connector = document.createElement('div');
      connector.style.cssText = 'position:absolute;width:1px;height:8px;background:var(--muted);opacity:0.55;pointer-events:none;';
      solarLabelsEl.appendChild(connector);
      entry = { orb, wrap, label, connector, p };
      solarPlanetsById[p.id] = entry;
      wrap.onclick = (e) => { e.stopPropagation(); solarSelectedId = p.id; };
    }
    entry.p = p;
    entry.wrap.innerHTML = '';
    const svg = buildPlanetAvatar(p);
    svg.style.width = '100%'; svg.style.height = '100%';
    entry.wrap.appendChild(svg);
    entry.label.textContent = p.name;
  });
  Object.keys(solarPlanetsById).forEach(id => {
    if (!seen[id]) {
      solarPlanetsById[id].wrap.remove();
      solarPlanetsById[id].label.remove();
      solarPlanetsById[id].connector.remove();
      delete solarPlanetsById[id];
      if (solarSelectedId === id) solarSelectedId = null;
    }
  });
  if (solarOrbitsSvgEl) drawSolarOrbits(solarOrbitsSvgEl);
}

function paintSolarStars() {
  if (!solarStarCtx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = solarViewportW, h = solarViewportH;
  const canvas = solarStarCtx.canvas;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  solarStarCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  solarStarCtx.clearRect(0, 0, w, h);
  const n = Math.round((w*h)/3400);
  for (let i=0;i<n;i++) {
    const x = Math.random()*w, y = Math.random()*h;
    const r = Math.random()*1.3 + 0.3;
    solarStarCtx.beginPath();
    solarStarCtx.arc(x, y, r, 0, Math.PI*2);
    solarStarCtx.fillStyle = 'rgba(255,255,255,'+(0.35+Math.random()*0.5).toFixed(2)+')';
    solarStarCtx.fill();
  }
}

function drawSolarOrbits(svgEl) {
  svgEl.innerHTML = '';
  const ns = "http://www.w3.org/2000/svg";
  Object.values(solarPlanetsById).forEach(entry => {
    const orbitEl = document.createElementNS(ns, 'ellipse');
    orbitEl.setAttribute('cx', 500); orbitEl.setAttribute('cy', 500);
    orbitEl.setAttribute('rx', entry.orb.a); orbitEl.setAttribute('ry', entry.orb.b);
    orbitEl.setAttribute('fill', 'none');
    orbitEl.setAttribute('stroke', entry.p.color);
    orbitEl.setAttribute('stroke-opacity', '0.3');
    orbitEl.setAttribute('stroke-width', '1.4');
    orbitEl.setAttribute('transform', `rotate(${entry.orb.rot*180/Math.PI} 500 500)`);
    svgEl.appendChild(orbitEl);
  });
}

function updateSolarCameraTarget() {
  const fitScale = Math.min(solarViewportW, solarViewportH) / 1150;
  if (solarSelectedId && solarPlanetsById[solarSelectedId]) {
    const entry = solarPlanetsById[solarSelectedId];
    const pos = planetPositionAt(entry.orb, solarClock);
    const zoomScale = Math.max(fitScale * 7, 2.4);
    solarCamTarget.s = zoomScale;
    solarCamTarget.tx = solarViewportW/2 - pos.x*zoomScale;
    solarCamTarget.ty = solarViewportH/2 - pos.y*zoomScale;
  } else {
    solarCamTarget.s = fitScale;
    solarCamTarget.tx = solarViewportW/2 - 500*fitScale;
    solarCamTarget.ty = solarViewportH/2 - 500*fitScale;
  }
}

function renderSolarBottomBar() {
  const bar = document.getElementById('solarBottomBar');
  if (!bar) return;
  if (!solarSelectedId || !solarPlanetsById[solarSelectedId]) {
    bar.style.display = 'none';
    solarBottomBarFor = null;
    return;
  }
  bar.style.display = 'block';
  if (solarBottomBarFor === solarSelectedId) return;
  const entry = solarPlanetsById[solarSelectedId];
  const p = entry.p;
  const learnedCount = (p.unlocked||[]).length;
  bar.innerHTML = '';
  bar.appendChild(el(`
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
      <h2 style="font-size:19px;">${p.name}</h2>
      <span style="color:var(--muted);font-size:13px;">🌙 ${learnedCount}</span>
    </div>
  `));
  const learned = (p.unlocked||[]).map(id => TOPICS.find(t=>t.id===id)).filter(Boolean);
  const chipsWrap = el(`<div style="display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;justify-content:${learned.length?'flex-start':'center'};"></div>`);
  if (learned.length === 0) {
    chipsWrap.appendChild(el(`<div style="color:var(--muted);font-size:12.5px;">Aún sin lunas</div>`));
  } else {
    learned.forEach(t => {
      chipsWrap.appendChild(el(`<div style="flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:11.5px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,0.3);">${t.title}</div>`));
    });
  }
  bar.appendChild(chipsWrap);
  const actions = el(`<div style="display:flex;gap:10px;justify-content:center;margin-top:8px;"></div>`);
  const openBtn = el(`<button class="solar-btn">Ver perfil completo →</button>`);
  openBtn.onclick = () => { currentProfileId = p.id; renderProfile(); };
  actions.appendChild(openBtn);
  bar.appendChild(actions);
  solarBottomBarFor = solarSelectedId;
}

function renderSolarMoons() {
  const container = document.getElementById('solarMoonsLayer');
  if (!container) return;
  if (!solarSelectedId || !solarPlanetsById[solarSelectedId]) {
    if (solarMoonEls.length) { solarMoonEls.forEach(m=>{ m.wrap.remove(); m.label.remove(); }); solarMoonEls = []; }
    solarMoonsFor = null;
    return;
  }
  const entry = solarPlanetsById[solarSelectedId];
  const p = entry.p;
  const learned = (p.unlocked || []).map(id => TOPICS.find(t=>t.id===id)).filter(Boolean);
  const pos = planetPositionAt(entry.orb, solarClock);
  const screenX = solarCam.tx + pos.x*solarCam.s;
  const screenY = solarCam.ty + pos.y*solarCam.s;

  if (solarMoonsFor !== solarSelectedId || solarMoonEls.length !== learned.length) {
    solarMoonEls.forEach(m=>{ m.wrap.remove(); m.label.remove(); });
    solarMoonEls = learned.map(() => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;';
      const label = document.createElement('div');
      label.className = 'solar-moon-label';
      container.appendChild(wrap);
      container.appendChild(label);
      return { wrap, label };
    });
    solarMoonsFor = solarSelectedId;
  }

  const radius = 78;
  learned.forEach((topic, i) => {
    const angle = (i/Math.max(learned.length,1)) * Math.PI*2 + solarClock*(prefersReducedMotion?0:0.4);
    const mx = screenX + Math.cos(angle)*radius;
    const my = screenY + Math.sin(angle)*radius*0.6;
    const m = solarMoonEls[i];
    m.wrap.style.left = (mx-5)+'px'; m.wrap.style.top = (my-5)+'px';
    m.wrap.style.background = p.color;
    m.wrap.style.boxShadow = `0 0 8px ${p.color}`;
    m.label.style.left = mx+'px'; m.label.style.top = (my+8)+'px';
    m.label.textContent = topic.title;
  });
}

function solarFrame(ts) {
  if (!solarActive) return;
  if (solarLastTs == null) solarLastTs = ts;
  const dt = Math.min((ts - solarLastTs)/1000, 0.1);
  solarLastTs = ts;
  if (!solarPaused) solarClock += dt;

  updateSolarCameraTarget();
  const lerp = prefersReducedMotion ? 1 : 0.1;
  solarCam.s += (solarCamTarget.s - solarCam.s) * lerp;
  solarCam.tx += (solarCamTarget.tx - solarCam.tx) * lerp;
  solarCam.ty += (solarCamTarget.ty - solarCam.ty) * lerp;

  solarSceneEl.style.transform = `translate(${solarCam.tx}px, ${solarCam.ty}px) scale(${solarCam.s})`;

  const showLabels = !solarSelectedId;
  Object.values(solarPlanetsById).forEach(entry => {
    const pos = planetPositionAt(entry.orb, solarClock);
    entry.wrap.style.transform = `translate(${pos.x - 32}px, ${pos.y - 32}px)`;
    const screenX = solarCam.tx + pos.x*solarCam.s;
    const screenY = solarCam.ty + pos.y*solarCam.s;
    const apparentR = 32*solarCam.s;
    entry.label.style.display = showLabels ? 'block' : 'none';
    entry.connector.style.display = showLabels ? 'block' : 'none';
    if (showLabels) {
      entry.label.style.left = screenX + 'px';
      entry.label.style.top = (screenY + apparentR + 8) + 'px';
      entry.connector.style.left = (screenX - 0.5) + 'px';
      entry.connector.style.top = (screenY + apparentR) + 'px';
    }
  });

  renderSolarBottomBar();
  renderSolarMoons();

  solarRafId = requestAnimationFrame(solarFrame);
}

function renderSolarSystem() {
  teardownSolarIfActive();
  currentView = 'solar';
  const app = document.getElementById('app');
  app.innerHTML = '';

  const view = document.createElement('div');
  view.className = 'solar-view';
  app.appendChild(view);

  const starCanvas = document.createElement('canvas');
  starCanvas.className = 'solar-canvas';
  view.appendChild(starCanvas);
  solarStarCtx = starCanvas.getContext('2d');

  const sceneWrap = document.createElement('div');
  sceneWrap.style.cssText = 'position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0;';
  view.appendChild(sceneWrap);
  solarSceneEl = sceneWrap;

  const orbitsSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  orbitsSvg.setAttribute('width', '1000'); orbitsSvg.setAttribute('height', '1000');
  orbitsSvg.style.cssText = 'position:absolute;left:0;top:0;overflow:visible;';
  sceneWrap.appendChild(orbitsSvg);
  solarOrbitsSvgEl = orbitsSvg;

  const starEl = document.createElement('div');

  moonsLayer.id = 'solarMoonsLayer';
  moonsLayer.style.cssText = 'position:absolute;inset:0;pointer-events:none;';

  };

  skipBtn.onclick = () => { renderHome(); };
  topbar.appendChild(pauseBtn);
  topbar.appendChild(skipBtn);
  view.appendChild(topbar);

  const bottomBar = document.createElement('div');
  bottomBar.id = 'solarBottomBar';
  bottomBar.className = 'solar-bottombar';
  bottomBar.style.display = 'none';
  view.appendChild(bottomBar);

  view.addEventListener('click', (e) => {
    if (e.target === view || e.target === starCanvas || e.target === starEl) {
      solarSelectedId = null;
    }
  });

  syncSolarPlanets();
  drawSolarOrbits(orbitsSvg);

  const resize = () => {
    solarViewportW = window.innerWidth;
    solarViewportH = window.innerHeight;
    paintSolarStars();
    const starPos = { x: solarViewportW/2, y: solarViewportH/2 };
    starLabel.style.left = starPos.x + 'px';
    starLabel.style.top = (starPos.y - 46) + 'px';
  };
  resize();
  solarOnResize = resize;
  window.addEventListener('resize', solarOnResize);

  const onVis = () => {
    if (document.hidden) {
      if (solarRafId) cancelAnimationFrame(solarRafId);
      solarRafId = null;
    } else if (solarActive && !solarRafId) {
      solarLastTs = null;
      solarRafId = requestAnimationFrame(solarFrame);
    }
  };
  solarOnVisibility = onVis;
  document.addEventListener('visibilitychange', solarOnVisibility);

  solarActive = true;
  solarRafId = requestAnimationFrame(solarFrame);
}

function ensureProfileDefaults(p) {
  if (!p.style) p.style = 'bands';

  return p;
}

function getProfile() {
  const p = profiles.find(p => p.id === currentProfileId);
  return p ? ensureProfileDefaults(p) : p;

function buildPlanetScene(p) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 400 260");
  svg.setAttribute("width","100%");
  svg.style.display = "block";
  const ns = svg.namespaceURI;
  const cx = 200, cy = 130;

  // background stars
  for (let i=0;i<40;i++) {
    const h = hash("bg"+i);
    const bx = h % 400, by = (h*7) % 260, r = 0.6 + (h % 3)*0.3;
    const dot = document.createElementNS(ns,"circle");
    dot.setAttribute("cx",bx); dot.setAttribute("cy",by); dot.setAttribute("r",r);
    dot.setAttribute("fill","#4a4480"); dot.setAttribute("opacity","0.5");
    svg.appendChild(dot);
  }

  const usePhoto = !!(p.realPlanetId && planetPhotoCache[p.realPlanetId]);
  const defs = document.createElementNS(ns,"defs");
  let fillRef;
  if (usePhoto) {
    const patId = "photo-"+p.id;
    const pattern = document.createElementNS(ns,"pattern");
    pattern.setAttribute("id", patId);
    pattern.setAttribute("patternUnits","objectBoundingBox");
    pattern.setAttribute("width","1"); pattern.setAttribute("height","1");
    const image = document.createElementNS(ns,"image");
    image.setAttributeNS("http://www.w3.org/1999/xlink","href", planetPhotoCache[p.realPlanetId]);
    image.setAttribute("href", planetPhotoCache[p.realPlanetId]);
    image.setAttribute("x","0"); image.setAttribute("y","0");
    image.setAttribute("width","1"); image.setAttribute("height","1");
    image.setAttribute("preserveAspectRatio","xMidYMid slice");
    pattern.appendChild(image);
    defs.appendChild(pattern);
    fillRef = `url(#${patId})`;
  } else {
    const grad = document.createElementNS(ns,"radialGradient");
    const gradId = "grad-"+p.id;
    grad.setAttribute("id", gradId);
    grad.setAttribute("cx","35%"); grad.setAttribute("cy","32%"); grad.setAttribute("r","75%");
    grad.innerHTML = `<stop offset="0%" stop-color="#fff" stop-opacity="0.85"/><stop offset="35%" stop-color="${p.color}"/><stop offset="100%" stop-color="#241f4c"/>`;
    defs.appendChild(grad);
    fillRef = `url(#${gradId})`;
  }

  const shadeGrad = document.createElementNS(ns,"radialGradient");
  const shadeId = "shade-"+p.id;
  shadeGrad.setAttribute("id", shadeId);
  shadeGrad.setAttribute("cx","72%"); shadeGrad.setAttribute("cy","75%"); shadeGrad.setAttribute("r","65%");
  shadeGrad.innerHTML = `<stop offset="0%" stop-color="#000" stop-opacity="0.55"/><stop offset="70%" stop-color="#000" stop-opacity="0.08"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>`;
  defs.appendChild(shadeGrad);
  svg.appendChild(defs);

  const learnedCount = p.unlocked.length;

  // outer ring milestones (or forced for Saturn-style planets)
  if (learnedCount >= 20) {
    const r2 = document.createElementNS(ns,"ellipse");
    r2.setAttribute("cx",cx); r2.setAttribute("cy",cy); r2.setAttribute("rx",92); r2.setAttribute("ry",22);
    r2.setAttribute("fill","none"); r2.setAttribute("stroke",p.color); r2.setAttribute("stroke-opacity","0.35"); r2.setAttribute("stroke-width","1.5");
    r2.setAttribute("class","ring-outer");
    svg.appendChild(r2);
  }
  if (learnedCount >= 10 || p.forceRing) {
    const r1 = document.createElementNS(ns,"ellipse");
    r1.setAttribute("cx",cx); r1.setAttribute("cy",cy); r1.setAttribute("rx",76); r1.setAttribute("ry",17);
    r1.setAttribute("fill","none"); r1.setAttribute("stroke",p.color); r1.setAttribute("stroke-opacity","0.45"); r1.setAttribute("stroke-width","1.5");
    r1.setAttribute("class","ring-outer");
    svg.appendChild(r1);
  }

  // glow halo
  const halo = document.createElementNS(ns,"circle");
  halo.setAttribute("cx",cx); halo.setAttribute("cy",cy); halo.setAttribute("r","62");
  halo.setAttribute("fill",p.color); halo.setAttribute("class","planet-halo");
  svg.appendChild(halo);

  // planet body
  const planet = document.createElementNS(ns,"circle");
  planet.setAttribute("cx",cx); planet.setAttribute("cy",cy); planet.setAttribute("r","44");
  planet.setAttribute("fill", fillRef);
  svg.appendChild(planet);

  // rotating texture bands (clipped to planet) — skipped when using a real NASA photo
  if (!usePhoto) {
    const clipId = "clip-"+p.id;
    const clip = document.createElementNS(ns,"clipPath");
    clip.setAttribute("id", clipId);
    const clipCircle = document.createElementNS(ns,"circle");
    clipCircle.setAttribute("cx",cx); clipCircle.setAttribute("cy",cy); clipCircle.setAttribute("r","44");
    clip.appendChild(clipCircle);
    defs.appendChild(clip);

    const bandGroup = document.createElementNS(ns,"g");
    bandGroup.setAttribute("clip-path",`url(#${clipId})`);
    bandGroup.setAttribute("class", p.style === "lava" ? "planet-halo" : "planet-band");
    const style = p.style || "bands";

    if (style === "bands") {
      [0,1,2].forEach(i => {
        const band = document.createElementNS(ns,"ellipse");
        band.setAttribute("cx", cx + (i-1)*20); band.setAttribute("cy", cy - 10 + i*14);
        band.setAttribute("rx","50"); band.setAttribute("ry","10");
        band.setAttribute("fill","#fff"); band.setAttribute("opacity", 0.06 + i*0.03);
        bandGroup.appendChild(band);
      });
    } else if (style === "rocky") {
      for (let i=0;i<10;i++) {
        const h1 = hash("rock"+p.id+i), h2 = hash("rockY"+p.id+i);
        const rx = cx - 44 + (h1 % 88), ry = cy - 44 + (h2 % 88);
        const crater = document.createElementNS(ns,"circle");
        crater.setAttribute("cx",rx); crater.setAttribute("cy",ry); crater.setAttribute("r", 2 + (h1%4));
        crater.setAttribute("fill","#000"); crater.setAttribute("opacity","0.15");
        bandGroup.appendChild(crater);
      }
    } else if (style === "crystal") {
      for (let i=0;i<7;i++) {
        const angle = (i / 7) * Math.PI * 2;
        const line = document.createElementNS(ns,"line");
        line.setAttribute("x1",cx); line.setAttribute("y1",cy);
        line.setAttribute("x2", cx + Math.cos(angle)*46); line.setAttribute("y2", cy + Math.sin(angle)*46);
        line.setAttribute("stroke","#fff"); line.setAttribute("stroke-width","1"); line.setAttribute("opacity","0.25");
        bandGroup.appendChild(line);
      }
    } else if (style === "lava") {
      [0,1,2].forEach(i => {
        const blob = document.createElementNS(ns,"ellipse");
        blob.setAttribute("cx", cx + (i-1)*16); blob.setAttribute("cy", cy + (i-1)*10);
        blob.setAttribute("rx","26"); blob.setAttribute("ry","14");
        blob.setAttribute("fill","#fff2c2"); blob.setAttribute("opacity", 0.12 + i*0.05);
        bandGroup.appendChild(blob);
      });
    }
    svg.appendChild(bandGroup);
  }

  // shading overlay for sphere volume (dark side)
  const shadeCircle = document.createElementNS(ns,"circle");
  shadeCircle.setAttribute("cx",cx); shadeCircle.setAttribute("cy",cy); shadeCircle.setAttribute("r","44");
  shadeCircle.setAttribute("fill",`url(#${shadeId})`);
  svg.appendChild(shadeCircle);

  // thin atmosphere rim
  const rim = document.createElementNS(ns,"circle");
  rim.setAttribute("cx",cx); rim.setAttribute("cy",cy); rim.setAttribute("r","44.5");
  rim.setAttribute("fill","none"); rim.setAttribute("stroke", p.color); rim.setAttribute("stroke-opacity","0.5"); rim.setAttribute("stroke-width","1");
  svg.appendChild(rim);

  // orbiting moons (one per unlocked topic)
  if (learnedCount > 0) {
    const orbitGroup = document.createElementNS(ns,"g");
    orbitGroup.setAttribute("class","orbit-group");
    p.unlocked.forEach((id, i) => {
      const shell = Math.floor(i / 8);
      const inShellIndex = i % 8;
      const inShellCount = Math.min(8, learnedCount - shell*8);
      const radius = 70 + shell*20;
      const angle = (inShellIndex / inShellCount) * Math.PI * 2 + shell*0.4;
      const mx = cx + Math.cos(angle) * radius;
      const my = cy + Math.sin(angle) * radius * 0.55;
      const moon = document.createElementNS(ns,"circle");
      moon.setAttribute("cx",mx); moon.setAttribute("cy",my); moon.setAttribute("r","4");
      moon.setAttribute("fill", p.color);
      orbitGroup.appendChild(moon);
      const moonGlow = document.createElementNS(ns,"circle");
      moonGlow.setAttribute("cx",mx); moonGlow.setAttribute("cy",my); moonGlow.setAttribute("r","7");
      moonGlow.setAttribute("fill", p.color); moonGlow.setAttribute("opacity","0.25");
      orbitGroup.insertBefore(moonGlow, moon);
    });
    svg.appendChild(orbitGroup);
  } else {
    const txt = document.createElementNS(ns,"text");
    txt.setAttribute("x", cx); txt.setAttribute("y", 220);
    txt.setAttribute("text-anchor","middle");
    txt.setAttribute("fill","#7a72ab");
    txt.setAttribute("font-size","12.5");
    txt.setAttribute("font-family","Sora, sans-serif");
    txt.textContent = "Aún sin lunas — descubre algo para ganar la primera";
    svg.appendChild(txt);
  }

  return svg;
}

      styleList.querySelectorAll('.cat-item').forEach((el2,i) => {
        const match = STYLES[i].id === rp.style;
        el2.style.borderColor = match ? 'var(--gold)' : 'var(--line)';
        el2.querySelector('.cat-item-count').textContent = match ? 'Elegido' : '';
      });
      realGrid.querySelectorAll('.real-planet-item').forEach(it => it.style.outline = 'none');
      item.style.outline = '2px solid var(--gold)';
    };
    realGrid.appendChild(item);
  });

  const swatchRow = overlay.querySelector('.swatch-row');
  COLORS.forEach(c => {
    const sw = el(`<div class="swatch" style="background:${c}"></div>`);
    if (c === chosenColor) sw.classList.add('selected');
    sw.onclick = () => {
      swatchRow.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      chosenColor = c;
      chosenRealPlanetId = null;
      realGrid.querySelectorAll('.real-planet-item').forEach(it => it.style.outline = 'none');
      colorPicker.value = c;
    };
    swatchRow.appendChild(sw);
  });

  const colorPicker = overlay.querySelector('#colorPicker');
  colorPicker.value = chosenColor;
  colorPicker.oninput = () => {
    chosenColor = colorPicker.value;
    chosenRealPlanetId = null;
    realGrid.querySelectorAll('.real-planet-item').forEach(it => it.style.outline = 'none');
    swatchRow.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
  };

  const styleList = overlay.querySelector('#styleList');
  STYLES.forEach(s => {
    const item = el(`
      <div class="cat-item" style="${s.id===chosenStyle?'border-color:var(--gold);':''}">
        <span class="cat-item-name">${s.emoji} ${s.label}</span>
        <span class="cat-item-count">${s.id===chosenStyle?'Elegido':''}</span>
      </div>
    `);
    item.onclick = () => {
      chosenStyle = s.id;
      styleList.querySelectorAll('.cat-item').forEach(el2 => { el2.style.borderColor = 'var(--line)'; el2.querySelector('.cat-item-count').textContent = ''; });
      item.style.borderColor = 'var(--gold)';
      item.querySelector('.cat-item-count').textContent = 'Elegido';
    };
    styleList.appendChild(item);
  });

  overlay.querySelector('#saveBtn').onclick = () => {
    p.color = chosenColor;
    p.style = chosenStyle;
    p.forceRing = chosenRing;
    p.realPlanetId = chosenRealPlanetId;
    if (chosenRealPlanetId) ensurePlanetPhoto(chosenRealPlanetId);
    saveProfiles(profiles);
    overlay.remove();
    renderProfile();
  };
  document.body.appendChild(overlay);
}

function showFamilyProgressSheet() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0,10));
  }
  const dayLabels = days.map(d => {
    const dt = new Date(d + 'T00:00:00');
    return ['D','L','M','X','J','V','S'][dt.getDay()];
  });

  const overlay = el(`
    <div class="overlay">
      <div class="sheet">
        <button class="sheet-close">✕</button>
        <div class="eyebrow">Últimos 7 días</div>
        <h2 style="margin-bottom:6px;">Progreso familiar</h2>
        <p class="subtitle" style="margin-bottom:16px;">Un punto encendido significa que aprendió algo ese día.</p>
        <div id="progressTable"></div>
      </div>
    </div>
  `);
  overlay.querySelector('.sheet-close').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const table = overlay.querySelector('#progressTable');

  const headerRow = el(`<div style="display:flex;align-items:center;margin-bottom:10px;padding-left:106px;"></div>`);
  dayLabels.forEach(l => {
    headerRow.appendChild(el(`<div style="flex:1;text-align:center;font-size:11px;color:var(--muted);">${l}</div>`));
  });
  table.appendChild(headerRow);

  profiles.forEach(rawP => {
    const p = ensureProfileDefaults(rawP);
    const row = el(`<div style="display:flex;align-items:center;margin-bottom:12px;"></div>`);
    row.appendChild(el(`
      <div style="width:106px;display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <div style="width:22px;height:22px;border-radius:50%;background:${p.color};flex-shrink:0;"></div>
        <span style="font-size:12.5px;font-weight:600;">${p.name}</span>
      </div>
    `));
    days.forEach(d => {
      const active = !!p.activityLog[d];
      row.appendChild(el(`
        <div style="flex:1;display:flex;justify-content:center;">
          <div style="width:16px;height:16px;border-radius:50%;background:${active ? p.color : 'transparent'};border:1.5px solid ${active ? p.color : 'var(--line)'};"></div>
        </div>
      `));
    });
    table.appendChild(row);
  });

  document.body.appendChild(overlay);
}

function showCategorySheet(p) {
  const overlay = el(`
    <div class="overlay">
      <div class="sheet">
        <button class="sheet-close">✕</button>
        <div class="eyebrow">Elige un tema</div>
        <h2>¿Qué te late hoy?</h2>
        <div class="cat-list"></div>
      </div>
    </div>
  `);
  overlay.querySelector('.sheet-close').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const list = overlay.querySelector('.cat-list');
  CATEGORIES.forEach(cat => {
    const total = TOPICS.filter(t=>t.cat===cat).length;
    const done = TOPICS.filter(t=>t.cat===cat && p.unlocked.includes(t.id)).length;
    const meta = catMeta(cat);
    const item = el(`
      <div class="cat-item" style="border-left:4px solid ${meta.color};">
        <span class="cat-item-name">${meta.icon} ${cat}</span>
        <span class="cat-item-count">${done}/${total}</span>
      </div>
    `);
    item.onclick = () => { overlay.remove(); showTopicSheet(p, cat); };
    list.appendChild(item);
  });
  document.body.appendChild(overlay);
}

function showTopicSheet(p, cat) {
  const meta = catMeta(cat);
  const overlay = el(`
    <div class="overlay">
      <div class="sheet">
        <button class="sheet-close">✕</button>
        <div class="eyebrow" style="color:${meta.color};">${meta.icon} ${cat}</div>
        <h2 style="margin-bottom:14px;">Temas</h2>
        <div class="topic-list"></div>
      </div>
    </div>
  `);
  overlay.querySelector('.sheet-close').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const list = overlay.querySelector('.topic-list');
  TOPICS.filter(t=>t.cat===cat).forEach(t => {
    const learned = p.unlocked.includes(t.id);
    const item = el(`
      <div class="topic-item ${learned?'learned':''}">
        <span class="topic-star">${learned?'⭐':'☆'}</span>
        <span class="topic-name">${t.title}</span>
      </div>
    `);
    if (!learned) item.onclick = () => { overlay.remove(); showDetailSheet(p, t); };
    list.appendChild(item);
  });
  document.body.appendChild(overlay);
}

function showDetailSheet(p, t) {
  const existingNotes = notesStore[t.id] || [];
  const notesHtml = existingNotes.length ? `
    <div class="eyebrow" style="margin-top:16px;">Notas de la familia</div>
    <div style="margin-top:8px;">
      ${existingNotes.map(n => `
        <div style="background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:13px;">
          <strong style="color:var(--gold);">${n.author}:</strong> ${n.text}
        </div>
      `).join('')}
    </div>
  ` : '';

  const detailMeta = catMeta(t.cat);
  const overlay = el(`
    <div class="overlay">
      <div class="sheet detail-card">
        <button class="sheet-close">✕</button>
        <div class="detail-cat" style="color:${detailMeta.color};">${detailMeta.icon} ${t.cat}</div>
        <h2 class="detail-title">${t.title}</h2>
        <p class="detail-body">${t.body}</p>
        ${notesHtml}
        <div class="eyebrow" style="margin-top:16px;">Deja tu nota (opcional)</div>
        <textarea id="noteInput" placeholder="Algo que te haya sorprendido..." maxlength="140" style="width:100%;margin-top:6px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-family:'Sora',sans-serif;font-size:13px;resize:none;" rows="2"></textarea>
        <button class="cta" style="margin-top:16px;">Ya lo aprendí ✨</button>
      </div>
    </div>
  `);
  overlay.querySelector('.sheet-close').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.querySelector('.cta').onclick = () => {
    const noteText = overlay.querySelector('#noteInput').value.trim();
    overlay.remove();
    showQuizSheet(p, t, noteText);
  };
  document.body.appendChild(overlay);
}

function showQuizSheet(p, t, noteText) {
  const quiz = QUIZZES[t.id];
  if (!quiz) { finishLearning(p, t, noteText, null); return; }

  const overlay = el(`
    <div class="overlay">
      <div class="sheet detail-card">
        <button class="sheet-close">✕</button>
        <div class="eyebrow">Pregunta rápida</div>
        <h2 style="font-size:18px;margin:8px 0 16px;">${quiz.q}</h2>
        <div id="quizOptions"></div>
      </div>
    </div>
  `);
  overlay.querySelector('.sheet-close').onclick = () => { overlay.remove(); finishLearning(p, t, noteText, null); };
  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); finishLearning(p, t, noteText, null); } };

  const optionsWrap = overlay.querySelector('#quizOptions');
  quiz.options.forEach((opt, i) => {
    const btn = el(`<div class="cat-item" style="cursor:pointer;"><span class="cat-item-name">${opt}</span></div>`);
    btn.onclick = () => {
      const correct = i === quiz.correct;
      optionsWrap.querySelectorAll('.cat-item').forEach((it, j) => {
        it.style.cursor = 'default';
        it.onclick = null;
        if (j === quiz.correct) it.style.borderColor = '#4caf50';
        if (j === i && !correct) it.style.borderColor = 'var(--coral)';
      });
      const feedback = el(`
        <div style="margin-top:16px;text-align:center;">
          <div style="font-size:14px;color:${correct ? '#4caf50' : 'var(--coral)'};font-weight:600;margin-bottom:12px;">
            ${correct ? '¡Correcto! 🌟' : 'Casi — la respuesta correcta está marcada en verde'}
          </div>
          <button class="cta" id="continueBtn">Continuar</button>
        </div>
      `);
      overlay.querySelector('.sheet').appendChild(feedback);
      overlay.querySelector('#continueBtn').onclick = () => {
        overlay.remove();
        finishLearning(p, t, noteText, correct);
      };
    };
    optionsWrap.appendChild(btn);
  });
  document.body.appendChild(overlay);
}

function finishLearning(p, t, noteText, quizCorrect) {
  if (!p.unlocked.includes(t.id)) p.unlocked.push(t.id);
  const today = todayKey();
  if (p.lastActive !== today) {
    p.streak = (p.lastActive === yesterdayKey()) ? p.streak + 1 : 1;
    p.lastActive = today;
  }
  p.activityLog[today] = (p.activityLog[today] || 0) + 1;
  if (noteText) {
    if (!notesStore[t.id]) notesStore[t.id] = [];
    notesStore[t.id].push({ author: p.name, text: noteText, date: today });
    saveNotes(notesStore);
  }
  const earnedNow = getEarnedBadges(p);
  const newBadges = earnedNow.filter(b => !p.seenBadges.includes(b.id));
  p.seenBadges = earnedNow.map(b => b.id);
  saveProfiles(profiles);
  renderProfile();
  showLearnedConfirmation(newBadges, quizCorrect);
}

function showLearnedConfirmation(newBadges, quizCorrect) {
  const badgeHtml = newBadges.length
    ? `<div style="font-size:34px;margin-bottom:6px;">${newBadges.map(b=>b.emoji).join(' ')}</div>
       <div class="eyebrow" style="color:var(--gold);">¡Nueva insignia!</div>
       <div style="font-weight:600;font-size:15px;margin-bottom:14px;">${newBadges.map(b=>b.title).join(', ')}</div>`
    : `<div style="font-size:34px;margin-bottom:10px;">✨</div>`;
  const quizNote = quizCorrect === true ? `<div style="font-size:12.5px;color:#4caf50;margin-bottom:10px;">Acertaste la pregunta de repaso 🌟</div>` : '';
  const overlay = el(`
    <div class="overlay">
      <div class="sheet detail-card" style="text-align:center;">
        <button class="sheet-close">✕</button>
        ${badgeHtml}
        ${quizNote}
        <h2 style="margin:6px 0 10px;font-size:19px;">¡Bien hecho!</h2>
        <p class="subtitle" style="font-size:14px;">${randomPhrase()}</p>
        <button class="cta">Seguir aprendiendo</button>
      </div>
    </div>
  `);
  overlay.querySelector('.sheet-close').onclick = () => overlay.remove();
  overlay.querySelector('.cta').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

startApp();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  try {
    const swCode = `
      const CACHE = 'universo-familiar-v1';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.add(self.registration.scope)));
        self.skipWaiting();
      });
      self.addEventListener('fetch', e => {
        e.respondWith(
          caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
            const clone = res.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
            return res;
          }).catch(() => cached))
        );
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  } catch (e) {}
}
</script>
