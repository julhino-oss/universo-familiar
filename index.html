<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Universo%20Familiar%22%2C%22short_name%22%3A%22Universo%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23171335%22%2C%22theme_color%22%3A%22%23171335%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171335;
    --bg-deep: #100d26;
    --card: #241f4c;
    --card-hi: #2e2861;
    --gold: #f4b740;
    --coral: #ff6f5b;
    --text: #f5f1ff;
    --muted: #9c93c4;
    --line: #3a3470;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 700px 500px at 15% -5%, rgba(255,111,91,0.16) 0%, transparent 60%),
      radial-gradient(ellipse 600px 600px at 90% 15%, rgba(196,140,255,0.18) 0%, transparent 55%),
      radial-gradient(ellipse 800px 700px at 50% 100%, rgba(77,208,225,0.10) 0%, transparent 60%),
      radial-gradient(circle at 20% -10%, #241f5c 0%, var(--bg-deep) 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Sora', system-ui, -apple-system, sans-serif;
    position: relative;
  }
  .stars-layer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .stars-layer::before, .stars-layer::after {
    content: "";
    position: absolute; inset: 0;
    background-repeat: repeat;
    background-image:
      radial-gradient(1.4px 1.4px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 90px 80px, #fff, transparent),
      radial-gradient(1.6px 1.6px at 150px 20px, #fff, transparent),
      radial-gradient(1px 1px at 60px 140px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 180px 120px, #fff, transparent),
      radial-gradient(1px 1px at 120px 170px, #fff, transparent);
    background-size: 220px 200px;
    opacity: 0.5;
    animation: twinkle 5s ease-in-out infinite;
  }
  .stars-layer::after {
    background-size: 300px 280px;
    background-position: 40px 60px;
    opacity: 0.3;
    animation: twinkle 7s ease-in-out infinite reverse;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 0.6; } }
  @media (prefers-reduced-motion: reduce) {
    .stars-layer::before, .stars-layer::after { animation: none; }
  }
  body {
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
  }
  .wrap { width: 100%; max-width: 480px; position: relative; z-index: 1; }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .title { font-size: 26px; font-weight: 700; line-height: 1.15; }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 8px; }

  /* ---- Shared header + planet avatar ---- */
  .home-header { margin-bottom: 24px; }
  .planet-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 6px 14px rgba(8,6,24,0.4);
  }
  .planet-avatar svg { width: 100%; height: 100%; }

  /* ---- Profile view ---- */
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .back-btn {
    background: none; border: none; color: var(--muted);
    font-size: 14px; cursor: pointer; padding: 6px 0;
  }
  .back-btn:hover { color: var(--text); }
  .streak-chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    display: flex; align-items: center; gap: 5px;
    box-shadow: 0 3px 10px rgba(8,6,24,0.3);
  }
  .profile-header { text-align: center; margin-bottom: 6px; }
  .sky-wrap {
    background: linear-gradient(180deg, #201a4a 0%, #14112f 100%);
    border-radius: 24px;
    border: 1px solid var(--line);
    padding: 8px;
    margin: 18px 0;
    overflow: hidden;
  }
  .progress-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); margin: 10px 4px 0;
  }
  .progress-bar { height: 6px; background: #2a2557; border-radius: 4px; overflow: hidden; margin: 8px 0 2px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--coral), var(--gold)); }

  button.cta {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--coral), #ff9060);
    color: #1c0e08;
    font-weight: 700;
    font-size: 15px;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
  }
  button.cta:active { transform: scale(0.98); }

  /* ---- Modal / overlay ---- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 8, 26, 0.72);
    backdrop-filter: blur(3px);
    display: flex; align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .sheet {
    background: #1c1846;
    border: 1px solid var(--line);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 480px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 22px 20px 28px;
    box-shadow: 0 -10px 34px rgba(0,0,0,0.45);
  }
  .sheet-close {
    display: block; margin: 0 0 12px auto;
    background: var(--card); border: none; color: var(--muted);
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-size: 15px;
  }
  .cat-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .cat-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(8,6,24,0.25);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .cat-item:hover { background: var(--card-hi); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(8,6,24,0.35); }
  .cat-item-name { font-weight: 600; font-size: 14.5px; }
  .cat-item-count { color: var(--muted); font-size: 12px; }

  .topic-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 3px 10px rgba(8,6,24,0.25);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .topic-item:not(.learned):hover { background: var(--card-hi); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(8,6,24,0.35); }
  .topic-item.learned { opacity: 0.5; cursor: default; box-shadow: none; }
  .topic-star { font-size: 15px; }
  .topic-name { font-size: 14px; font-weight: 500; }

  .detail-card { text-align: left; }
  .detail-cat { color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .detail-title { font-size: 20px; margin: 8px 0 14px; }
  .detail-body { font-size: 14.5px; line-height: 1.6; color: #ded9f5; }
  .deepen { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .deepen summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--gold); list-style: revert; }
  .deepen summary::marker { color: var(--gold); }
  .deepen[open] summary { margin-bottom: 4px; }

  input.name-input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: 'Sora', sans-serif;
    margin-top: 14px;
  }
  input.name-input:focus { outline: 2px solid var(--gold); }
  .swatch-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
  }
  .swatch.selected { border-color: white; }
  .empty-note { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 10px; }

  /* ---- Planet animation ---- */
  .planet-halo { animation: pulse-glow 4s ease-in-out infinite; transform-origin: 200px 130px; }
  .planet-band { animation: band-shift 26s linear infinite; transform-origin: 200px 130px; }
  .planet-clouds { animation: band-shift 46s linear infinite reverse; transform-origin: 200px 130px; }
  .orbit-group { animation: orbit-spin 42s linear infinite; transform-origin: 200px 130px; }
  @keyframes pulse-glow { 0%,100% { opacity: .22; } 50% { opacity: .48; } }
  @keyframes band-shift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes orbit-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .planet-halo, .planet-band, .planet-clouds, .orbit-group { animation: none; }
  }

  /* ---- Solar system view ---- */
  .solar-view {
    position: fixed; inset: 0;
    background: #05040c;
    overflow: hidden;
    z-index: 20;
    touch-action: none;
  }
  .solar-canvas, .solar-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .solar-svg { touch-action: none; }
  .solar-label {
    position: absolute;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-shadow: 0 1px 5px rgba(0,0,0,0.85);
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, 4px);
  }
  .solar-moon-label {
    position: absolute;
    color: var(--muted);
    font-family: 'Sora', sans-serif;
    font-size: 9px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.85);
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, 2px);
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .solar-star-label {
    position: absolute;
    color: var(--gold);
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  .solar-topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px; z-index: 3;
  }
  .solar-btn {
    background: rgba(36,31,76,0.85); border: 1px solid var(--line); color: var(--text);
    font-family: 'Sora', sans-serif; font-size: 12.5px; padding: 9px 15px; border-radius: 20px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .solar-btn:hover { background: rgba(46,40,97,0.9); }
  .solar-bottombar {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, transparent, rgba(10,8,26,0.88) 35%, #0e0b24 75%);
    padding: 26px 18px 22px;
    z-index: 3;
    text-align: center;
  }
  @media (prefers-reduced-motion: reduce) {
    .solar-view * { transition: none !important; }
  }
</style>
</head>

<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (app) {
    app.innerHTML = '<div style="background:#2e2861;border:1px solid #ff6f5b;border-radius:16px;padding:18px;margin-top:20px;font-family:sans-serif;font-size:13px;color:#f5f1ff;white-space:pre-wrap;">' +
      '<strong style="color:#ff6f5b;">Error detectado:</strong>\n' +
      (e.message || 'desconocido') + '\n' +
      'Línea: ' + (e.lineno || '?') + ', Columna: ' + (e.colno || '?') +
      '</div>';
  }
});
</script>

<script>
const TOPICS = [
  {id:"cn1",cat:"Ciencia y Naturaleza",title:"Qué es la cadena alimenticia",body:"Es el orden en que unos seres vivos se alimentan de otros: las plantas producen su propio alimento con el sol, los herbívoros comen plantas, y los carnívoros comen a otros animales. Si un eslabón desaparece, todos los demás se ven afectados.",deepen:["Los científicos llaman 'productores' a las plantas porque son las únicas que pueden crear alimento de la nada (con luz, agua y aire). Todo lo demás en la cadena —desde un conejo hasta un león— depende, directa o indirectamente, de ese primer eslabón. Por eso cuando se tala un bosque entero, no solo desaparecen árboles: se rompe la base que sostenía a cientos de animales distintos.","Además, la energía se va perdiendo en cada paso: un conejo aprovecha solo una parte de la energía de la planta que comió, y el zorro que se come al conejo aprovecha aún menos. Por eso siempre hay muchas más plantas que herbívoros, y muchos más herbívoros que depredadores — la pirámide se hace más angosta mientras más arriba subes."]},
  {id:"cn2",cat:"Ciencia y Naturaleza",title:"Por qué truena y relampaguea",body:"Dentro de una tormenta, el aire se carga de electricidad y esa energía se libera de golpe como un rayo de luz: el relámpago. El trueno es el sonido que hace el aire al calentarse tan rápido con esa descarga; se ve primero porque la luz viaja más rápido que el sonido.",deepen:["Dentro de una nube de tormenta, el hielo y el agua chocan entre sí sin parar, arrastrados por corrientes de aire muy fuertes. Ese roce constante separa las cargas eléctricas: las positivas suben a la parte alta de la nube y las negativas se acumulan abajo, como si la nube fuera una pila gigante.","Cuando la diferencia de carga es suficientemente grande, salta una chispa gigantesca entre la nube y el suelo (o entre dos nubes): eso es el rayo. Puede alcanzar temperaturas de hasta 30,000°C, cinco veces más caliente que la superficie del sol, y ese calor extremo es justo lo que hace que el aire se expanda de golpe y produzca el estruendo del trueno."]},
  {id:"cn3",cat:"Ciencia y Naturaleza",title:"Cómo se forma un arcoíris",body:"Cuando el sol brilla mientras todavía hay gotitas de lluvia en el aire, la luz entra en cada gota y se separa en todos sus colores, como si la gota fuera un pequeño prisma. Por eso los arcoíris aparecen justo después de llover, con el sol detrás de ti.",deepen:["Cuando la luz del sol entra a una gota de lluvia, no solo se separa en colores: también rebota dentro de la gota como en un espejo antes de salir de nuevo hacia tus ojos. Ese rebote es clave — sin él, la luz seguiría de largo y nunca verías el arcoíris.","Cada persona ve un arcoíris ligeramente distinto, formado por gotas diferentes, porque depende del ángulo exacto entre el sol, la lluvia y tus propios ojos. Por eso es imposible 'llegar' a un arcoíris o pararse debajo de él: se mueve contigo, porque en realidad es tu arcoíris personal, formado solo para el lugar exacto donde estás parado."]},
  {id:"cn4",cat:"Ciencia y Naturaleza",title:"Por qué las plantas necesitan el sol",body:"Las plantas usan la luz del sol como si fuera comida: la combinan con agua y aire para fabricar su propio alimento, en un proceso llamado fotosíntesis. Sin luz, no pueden producir la energía que necesitan para crecer.",deepen:["Dentro de las hojas hay un pigmento verde llamado clorofila, que funciona como una diminuta fábrica solar: atrapa la energía de la luz y la usa para unir agua (que sube desde las raíces) con dióxido de carbono (que entra por el aire) y fabricar azúcar, el alimento de la planta. Como resultado de ese proceso, la planta libera oxígeno al aire — el mismo que tú respiras.","Esto significa que, en cierta forma, cada bocado de comida que existe en el planeta —incluso la carne que come un león— empezó como luz solar convertida en azúcar por una planta. Por eso la fotosíntesis se considera el proceso que sostiene casi toda la vida en la Tierra."]},
  {id:"cn5",cat:"Ciencia y Naturaleza",title:"Qué es la erosión",body:"Es el desgaste lento que el agua, el viento y el hielo le hacen a las rocas y la tierra con el paso del tiempo. Así se formaron muchos cañones y valles: no de un día para otro, sino durante miles o millones de años.",deepen:["La erosión no actúa igual en todos lados: el agua de un río desgasta la roca poco a poco arrastrando piedritas que actúan como lija, mientras que el hielo se mete en las grietas de una roca y, al congelarse, se expande y la parte en pedazos. El viento, por su parte, lanza granos de arena a gran velocidad que van puliendo la piedra con el tiempo.","El Gran Cañón, en Estados Unidos, es un ejemplo extremo: el río Colorado tardó millones de años en excavar una grieta de casi 1.6 kilómetros de profundidad, capa por capa, dejando a la vista rocas que se formaron mucho antes de que existieran los dinosaurios."]},

  {id:"te1",cat:"Tecnología e IA",title:"Qué es internet",body:"Es una gigantesca red que conecta computadoras y celulares de todo el mundo entre sí, para que puedan enviarse información. Gracias a eso puedes video-llamar a alguien en otro país o ver una página web que está guardada en una computadora lejana.",deepen:["Internet no es una sola red, sino millones de redes más pequeñas conectadas entre sí — de oficinas, universidades, gobiernos y proveedores de todo el mundo — que se pusieron de acuerdo para 'hablar el mismo idioma' técnico y así poder intercambiar información sin importar en qué país estén.","Cuando mandas un mensaje, la información no viaja de un solo tirón: se divide en pequeños paquetes que pueden tomar caminos distintos por cable, fibra óptica o satélite, y se vuelven a juntar en el orden correcto justo antes de llegar a la pantalla de quien lo recibe. Por eso internet sigue funcionando aunque una parte de la red falle: la información simplemente busca otro camino."]},
  {id:"te2",cat:"Tecnología e IA",title:"Por qué es importante una buena contraseña",body:"Una contraseña es como la llave de una casa digital: si es fácil de adivinar (como '1234'), cualquiera puede entrar a tus cuentas. Mientras más larga y menos obvia sea, más difícil es que alguien más la descubra.",deepen:["Los programas que intentan 'adivinar' contraseñas no lo hacen de una en una como una persona: pueden probar millones de combinaciones por segundo. Una contraseña corta como '1234' se puede adivinar en menos de un segundo, mientras que una larga y con letras, números y símbolos mezclados puede tardar siglos en descifrarse por fuerza bruta.","Por eso los expertos en seguridad recomiendan usar frases largas y fáciles de recordar para ti, pero difíciles de adivinar para otros (como unir varias palabras sin relación), en vez de contraseñas cortas y complicadas que terminas anotando en un papel — que es, irónicamente, mucho menos seguro."]},
  {id:"te3",cat:"Tecnología e IA",title:"Qué es un algoritmo",body:"Es una lista de pasos ordenados para resolver algo, como una receta de cocina pero para una computadora. Cuando un mapa te dice el camino más corto, o una app te recomienda un video, están siguiendo un algoritmo por detrás.",deepen:["La palabra 'algoritmo' viene del nombre de un matemático persa, Al-Juarismi, que vivió hace más de 1,200 años y escribió unos de los primeros métodos ordenados para resolver problemas matemáticos paso a paso — mucho antes de que existieran las computadoras.","Hoy, casi todo lo que usas en un celular corre gracias a algoritmos: uno decide qué fotos te muestra primero, otro calcula la ruta más rápida en un mapa, y otro corrige las palabras que escribes mal. No son 'inteligentes' por sí solos — simplemente siguen exactamente los pasos que alguien programó, una y otra vez, muy rápido."]},
  {id:"te4",cat:"Tecnología e IA",title:"Qué es la realidad virtual",body:"Es una tecnología que, usando unos lentes especiales, te hace sentir que estás dentro de un mundo digital en vez de en el cuarto donde realmente estás. La computadora cambia lo que ves según hacia dónde mueves la cabeza, para que se sienta real.",deepen:["Los lentes de realidad virtual engañan a tu cerebro mostrando una imagen ligeramente distinta a cada ojo, tal como ve el mundo real cada uno de tus dos ojos por separado. Tu cerebro combina esas dos imágenes y las interpreta como profundidad, haciendo que el mundo digital se sienta 'con volumen' en vez de plano.","Además, sensores dentro de los lentes detectan hacia dónde giras la cabeza muchas veces por segundo, y actualizan la imagen casi al instante — si hubiera un retraso notable entre tu movimiento y lo que ves, el cerebro se confunde y puede causar mareo, algo que los ingenieros trabajan mucho en evitar."]},
  {id:"te5",cat:"Tecnología e IA",title:"Por qué las computadoras usan solo 0 y 1",body:"Por dentro, una computadora funciona con pequeños interruptores eléctricos que solo pueden estar encendidos o apagados: eso es lo que representan el 1 y el 0. Combinando millones de esos encendidos y apagados a toda velocidad, la computadora puede representar textos, fotos y videos.",deepen:["Ese sistema de solo dos valores se llama 'binario', y cada encendido/apagado individual se llama 'bit'. Para representar una sola letra como la 'A', una computadora necesita combinar 8 bits (por ejemplo 01000001) — y una foto o un video usan millones de esas combinaciones juntas.","Aunque para nosotros sería lentísimo leer código binario, las computadoras lo procesan a una velocidad increíble: los procesadores modernos pueden hacer miles de millones de esas operaciones de encendido/apagado en un solo segundo, lo que permite que todo se sienta instantáneo para nosotros."]},

  {id:"hi1",cat:"Historia y Culturas",title:"Qué fue la Ruta de la Seda",body:"Era un conjunto de caminos que conectaba Asia con Europa hace muchos siglos, por donde viajaban comerciantes vendiendo seda, especias y otras cosas. Además de productos, por esa ruta también viajaron ideas, inventos y costumbres entre culturas muy distintas.",deepen:["La Ruta de la Seda no era un solo camino, sino una red de rutas terrestres y marítimas que conectaba China con Europa pasando por Asia Central, India y Medio Oriente. Ningún comerciante la recorría completa: la mercancía pasaba de mano en mano entre distintos grupos, cada uno cubriendo solo un tramo.","Junto con la seda viajaron inventos como el papel y la pólvora, y hasta enfermedades que se contagiaron entre regiones muy lejanas entre sí. Por eso los historiadores la consideran una de las primeras muestras de que el mundo, aunque enorme, siempre estuvo más conectado de lo que parece."]},
  {id:"hi2",cat:"Historia y Culturas",title:"Por qué existen tantos idiomas distintos",body:"Cuando los grupos de personas viven separados por montañas, mares o mucha distancia durante generaciones, su forma de hablar va cambiando de manera diferente en cada lugar. Con el tiempo, esos cambios se acumulan tanto que terminan siendo idiomas distintos.",deepen:["Los lingüistas pueden agrupar idiomas en 'familias' según qué tan parecidos son entre sí, lo que ayuda a rastrear de dónde vinieron. Por ejemplo, el español, el francés y el italiano pertenecen a la misma familia porque los tres vienen del latín, aunque hoy sean idiomas distintos e incluso no siempre se entiendan entre sí.","Se calcula que hoy existen más de 7,000 idiomas en el mundo, pero muchos de ellos los hablan cada vez menos personas. Cuando un idioma deja de tener hablantes nuevos, desaparece — y con él, formas únicas de nombrar el mundo que no existen en ningún otro idioma."]},
  {id:"hi3",cat:"Historia y Culturas",title:"Qué eran las civilizaciones antiguas como los mayas", body:"Eran sociedades muy organizadas que construyeron ciudades, estudiaron las estrellas y crearon su propio calendario y forma de escritura, mucho antes de que existiera la tecnología moderna. Muchos de sus templos y pirámides todavía se pueden visitar hoy.",deepen:["Los mayas desarrollaron uno de los sistemas de escritura más complejos del mundo antiguo, con símbolos que podían representar tanto sonidos como ideas completas, y crearon un calendario tan preciso que calculaba el año casi con la misma exactitud que los calendarios modernos.","También fueron expertos en matemáticas: fueron una de las primeras civilizaciones del mundo en usar el concepto del número cero, algo que ni los griegos ni los romanos antiguos usaban en sus sistemas numéricos."]},
  {id:"hi4",cat:"Historia y Culturas",title:"Por qué las banderas representan a un país",body:"Una bandera es un símbolo que un país elige para que lo identifiquen de un vistazo, con colores y formas que suelen tener un significado especial para su historia. Por eso se le tiene tanto respeto: representa a todas las personas de ese lugar.",deepen:["Los colores y símbolos de una bandera casi nunca se eligen al azar: suelen representar algo del paisaje, la historia o los valores de ese país, como un color que recuerda la sangre de quienes lucharon por su independencia, o una estrella por cada región que lo conforma.","Por su fuerte significado, las banderas tienen reglas de respeto en casi todo el mundo: en muchos países está mal visto dejarla tocar el suelo, y existen protocolos específicos sobre cómo izarla, doblarla o incluso destruirla cuando ya está muy desgastada."]},
  {id:"hi5",cat:"Historia y Culturas",title:"Cómo se inventó la escritura",body:"Hace miles de años, algunas civilizaciones antiguas empezaron a dibujar símbolos para llevar cuentas de cosechas y comercio, y esos dibujos poco a poco se convirtieron en letras. Fue uno de los inventos más importantes de la historia, porque permitió guardar el conocimiento para siempre.",deepen:["Una de las escrituras más antiguas que se conocen es la cuneiforme, creada por los sumerios hace más de 5,000 años en lo que hoy es Irak. Al principio solo se usaba para anotar cuánto grano o ganado tenía cada persona — no para contar historias.","Con el tiempo, distintas culturas fueron creando sus propias formas de escritura de manera independiente, como los jeroglíficos egipcios o la escritura china, cada una adaptada a su propio idioma. Que la escritura naciera de necesidades tan prácticas como llevar cuentas es parte de por qué los historiadores la consideran una revolución silenciosa: cambió la forma en que los humanos podían recordar y transmitir todo."]},

  {id:"cs1",cat:"Cuerpo y Salud",title:"Por qué nos enfermamos",body:"Todos los días, virus y bacterias intentan entrar a tu cuerpo, pero tienes un sistema de defensa llamado sistema inmunológico que los combate. Cuando te enfermas, es porque uno de esos invasores logró pasar, y tu cuerpo está trabajando para vencerlo.",deepen:["Tu sistema inmunológico tiene distintos tipos de células especializadas: unas patrullan tu cuerpo buscando invasores, otras los atacan directamente, y otras 'recuerdan' a los enemigos que ya venciste antes, para reaccionar mucho más rápido si vuelven a aparecer.","Esa memoria es la razón por la que, por ejemplo, casi nunca te da varicela dos veces: la primera vez que tu cuerpo la venció, guardó la información de cómo hacerlo, lista para usarla de inmediato si el mismo virus regresa."]},
  {id:"cs2",cat:"Cuerpo y Salud",title:"Qué son las vacunas",body:"Una vacuna le enseña a tu sistema de defensa cómo reconocer y vencer a una enfermedad específica, sin que tengas que enfermarte de verdad primero. Así, si alguna vez te expones a esa enfermedad, tu cuerpo ya sabe cómo pelear contra ella.",deepen:["Una vacuna generalmente contiene una versión debilitada, inactiva, o solo una parte de un virus o bacteria — suficiente para que tu sistema inmunológico aprenda a reconocerlo, pero sin poder realmente enfermarte. Es como mostrarle una foto del 'enemigo' para que lo reconozca después.","Gracias a las vacunas, enfermedades que antes mataban a millones de personas cada año, como la viruela, se lograron eliminar casi por completo del planeta. Fue uno de los mayores logros médicos de la historia, y funcionó todavía mejor cuando la mayoría de la gente en un lugar estaba vacunada, protegiendo incluso a quienes no podían vacunarse."]},
  {id:"cs3",cat:"Cuerpo y Salud",title:"Por qué es importante lavarse las manos",body:"Las manos tocan superficies llenas de gérmenes todo el día, y si luego te tocas la boca, la nariz o los ojos, esos gérmenes pueden entrar a tu cuerpo. Lavarlas con agua y jabón arrastra la mayoría de esos gérmenes antes de que puedan hacerte daño.",deepen:["Un estudio clásico de un médico llamado Ignaz Semmelweis, en el siglo XIX, descubrió que muchas más pacientes morían en un hospital cuando los médicos no se lavaban las manos entre paciente y paciente — mucho antes de que se supiera que existían los gérmenes. En su época casi nadie le creyó, pero hoy lavarse las manos se considera una de las medidas de salud más importantes que existen.","Veinte segundos, más o menos lo que dura cantar 'Feliz cumpleaños' dos veces, es el tiempo mínimo recomendado para que el jabón realmente arrastre la mayoría de los gérmenes de la piel, en vez de solo mojarse las manos rápido."]},
  {id:"cs4",cat:"Cuerpo y Salud",title:"Qué hacen los pulmones",body:"Los pulmones toman el oxígeno del aire que respiras y lo pasan a la sangre, que lo reparte por todo tu cuerpo. Al mismo tiempo, sacan de tu cuerpo el dióxido de carbono que ya no necesitas, y lo expulsas cuando exhalas.",deepen:["Dentro de los pulmones hay millones de bolsitas diminutas llamadas alvéolos, tan pequeñas que si las extendieras todas juntas cubrirían casi la superficie de una cancha de tenis — ahí es donde realmente ocurre el intercambio entre el oxígeno que entra y el dióxido de carbono que sale.","Los pulmones no tienen músculos propios para moverse: es el diafragma, un músculo debajo de ellos, el que se contrae y relaja para que el aire entre y salga, como un fuelle. Por eso respirar 'con el estómago' (dejando que el diafragma se mueva bien) suele ayudar a relajarse."]},
  {id:"cs5",cat:"Cuerpo y Salud",title:"Por qué duelen los huesos cuando creces",body:"Cuando eres niño o adolescente, tus huesos están creciendo más rápido que en otras etapas de la vida, y ese estirón a veces produce una molestia llamada 'dolores de crecimiento'. No significa que algo esté mal, es simplemente tu cuerpo haciéndose más grande.",deepen:["Los huesos largos, como los de las piernas, crecen desde unas zonas especiales cerca de sus extremos llamadas placas de crecimiento, hechas de cartílago blando que poco a poco se convierte en hueso duro. Esas placas se cierran por completo cuando termina la adolescencia, y es ahí cuando el crecimiento en estatura se detiene.","Los llamados 'dolores de crecimiento' suelen sentirse más en las piernas, sobre todo de noche, y aunque su causa exacta no se conoce del todo, no están relacionados directamente con qué tan rápido estás creciendo en ese momento — muchos niños los sienten incluso en etapas de crecimiento más lento."]},

  {id:"es1",cat:"Espacio y Universo",title:"Qué es un agujero negro",body:"Es una zona del espacio donde la gravedad es tan fuerte que ni siquiera la luz puede escapar de ella, por eso se ve completamente negra. Se forma cuando una estrella muy grande se colapsa sobre sí misma al final de su vida.",deepen:["Aunque nada puede escapar de un agujero negro una vez que cruza cierto límite (llamado 'horizonte de eventos'), los científicos pueden detectarlos indirectamente: observan cómo su gravedad curva la luz de las estrellas a su alrededor, o cómo hace girar a gas y polvo cercanos a velocidades altísimas antes de ser 'tragados'.","En 2019, se logró tomar la primera fotografía real de un agujero negro, ubicado en el centro de una galaxia lejana — un logro que tomó años de trabajo de telescopios repartidos por todo el planeta, funcionando juntos como si fueran uno solo del tamaño de la Tierra."]},
  {id:"es2",cat:"Espacio y Universo",title:"Por qué las estrellas titilan",body:"Las estrellas en realidad brillan de forma constante, pero su luz tiene que atravesar toda la atmósfera de la Tierra antes de llegar a tus ojos, y el aire en movimiento la hace parpadear un poquito. Los planetas titilan menos porque se ven como un punto más grande de luz.",deepen:["Este parpadeo se llama 'centelleo' y es más notorio en estrellas que están más bajas en el cielo, cerca del horizonte, porque su luz tiene que atravesar una capa más gruesa de atmósfera antes de llegar hasta ti, comparado con una estrella justo arriba de tu cabeza.","Los telescopios más grandes, como los que están en la Estación Espacial o flotando en el espacio (como el telescopio Hubble), no sufren este centelleo porque están fuera de la atmósfera de la Tierra — por eso sus fotos del espacio se ven tan nítidas y sin parpadeo."]},
  {id:"es3",cat:"Espacio y Universo",title:"Qué es la Vía Láctea",body:"Es la galaxia donde vivimos: un enorme grupo de miles de millones de estrellas, entre ellas nuestro Sol, unidas por la gravedad y girando lentamente en el espacio. En una noche muy oscura, se puede ver como una franja brumosa cruzando el cielo.",deepen:["Nuestro sistema solar está ubicado en uno de los brazos espirales de la Vía Láctea, a unos 27,000 años luz del centro de la galaxia. Aunque parezca que estamos 'quietos', en realidad todo el sistema solar viaja alrededor de ese centro a una velocidad enorme, tardando unos 230 millones de años en dar una sola vuelta completa.","En el centro de la Vía Láctea los científicos creen que hay un agujero negro supermasivo, muchísimo más grande que los que se forman de una sola estrella, con una masa millones de veces mayor que la del Sol — y toda la galaxia gira lentamente a su alrededor."]},
  {id:"es4",cat:"Espacio y Universo",title:"Cómo se forman los cráteres de la Luna",body:"La Luna no tiene atmósfera que la proteja, así que cuando rocas del espacio (meteoritos) chocan contra su superficie a gran velocidad, dejan un hueco llamado cráter. Como no hay viento ni lluvia que los borre, esos cráteres pueden durar millones de años.",deepen:["Casi todos los cráteres de la Luna se formaron hace miles de millones de años, en una época en la que había muchísimos más asteroides y restos de roca flotando en el sistema solar recién formado, chocando entre sí y contra los planetas y lunas cercanas.","La Tierra recibió tantos o más impactos que la Luna en esa misma época, pero casi no se le notan porque tiene algo que la Luna no tiene: viento, lluvia, y movimiento constante de su superficie (tectónica de placas), que con el tiempo borran o entierran las marcas de esos choques antiguos."]},
  {id:"es5",cat:"Espacio y Universo",title:"Qué es un cometa",body:"Es una bola de hielo, polvo y roca que viaja alrededor del Sol en una órbita muy alargada. Cuando se acerca al Sol, el calor hace que parte de su hielo se convierta en gas y polvo, formando esa larga cola brillante que vemos desde la Tierra.",deepen:["Muchos cometas vienen de una zona muy lejana en los bordes del sistema solar, tan fría que el hielo que los forma prácticamente nunca se derrite mientras están ahí. Solo cuando su órbita los acerca al Sol empiezan a 'despertar' y a mostrar su característica cola.","Un mismo cometa puede pasar cerca de la Tierra una sola vez en la vida de una persona, o regresar cada varias décadas, dependiendo de qué tan larga sea su órbita alrededor del Sol. El cometa Halley, uno de los más famosos, regresa cada 76 años aproximadamente — la próxima vez que se podrá ver será en el año 2061."]},

  {id:"cu1",cat:"Curiosidades del Mundo",title:"Por qué los camaleones cambian de color",body:"Aunque mucha gente cree que lo hacen solo para esconderse, los camaleones cambian de color principalmente para comunicarse con otros camaleones y para regular su temperatura corporal. Un camaleón enojado o asustado puede volverse mucho más oscuro o brillante.",deepen:["Los camaleones cambian de color gracias a capas especiales de células en su piel que contienen diminutos cristales. Al relajar o tensar esas células, cambian la forma en que la luz rebota en los cristales, lo que hace que el color visible cambie — es un truco físico, no un simple 'pigmento que se mueve'.","Cada especie de camaleón tiene un rango de colores distinto: algunos apenas cambian entre tonos de café y verde, mientras que otros pueden mostrar rosas, azules y amarillos brillantes cuando quieren impresionar a otro camaleón o defender su territorio."]},
  {id:"cu2",cat:"Curiosidades del Mundo",title:"Cuál es el animal más grande que ha existido",body:"La ballena azul, que vive hoy en nuestros océanos, es el animal más grande que se conoce en toda la historia de la Tierra, incluso más grande que los dinosaurios más enormes. Su corazón solo puede compararse en tamaño con un auto pequeño.",deepen:["La ballena azul puede medir hasta 30 metros de largo, casi como tres autobuses escolares en fila, y pesar más que 30 elefantes juntos. A pesar de su tamaño gigantesco, se alimenta casi exclusivamente de kril, unos animalitos parecidos a camarones diminutos, tragando millones de ellos de una sola vez.","Su corazón late tan lento y fuerte que se puede detectar a varios kilómetros de distancia bajo el agua, y su canto —uno de los sonidos más fuertes producidos por cualquier animal— puede viajar cientos de kilómetros en el océano para comunicarse con otras ballenas."]},
  {id:"cu3",cat:"Curiosidades del Mundo",title:"Por qué los gatos ronronean",body:"Los gatos ronronean cuando están contentos, pero también lo hacen a veces cuando están heridos o nerviosos, porque esa vibración puede ayudar a calmarlos y hasta a sanar más rápido sus huesos y músculos. No siempre significa que estén felices.",deepen:["La frecuencia del ronroneo de un gato suele estar entre 25 y 150 hercios, un rango que algunos estudios relacionan con la capacidad de estimular la sanación de huesos y tejidos — por eso se cree que los gatos pueden ronronear incluso cuando están heridos o a punto de dar a luz, no solo cuando están contentos.","Los gatitos recién nacidos ya pueden ronronear desde los primeros días de vida, mucho antes de poder ver u oír bien, y se cree que lo usan para comunicarle a su mamá que están bien y cerca de ella."]},
  {id:"cu4",cat:"Curiosidades del Mundo",title:"Cómo encuentran el camino las aves migratorias",body:"Muchas aves recorren miles de kilómetros cada año guiándose por el sol, las estrellas, y hasta por el campo magnético de la Tierra, que pueden sentir de una forma que los humanos no tenemos. Así logran volver al mismo lugar exacto año tras año.",deepen:["Algunas aves migratorias nacen sabiendo la ruta que deben seguir, sin que nadie se las enseñe — es un comportamiento instintivo grabado desde que salen del huevo. Otras, en cambio, aprenden la ruta viajando junto a aves más experimentadas la primera vez.","Los científicos han descubierto que algunas aves tienen en su pico o cerebro diminutas partículas sensibles al campo magnético de la Tierra, funcionando casi como una brújula biológica interna — algo que ningún humano tiene de forma natural."]},
  {id:"cu5",cat:"Curiosidades del Mundo",title:"Por qué el chicle no se disuelve al masticarlo",body:"El chicle está hecho de una base de goma que no se deshace con la saliva, a diferencia del resto de sus ingredientes (como el azúcar y el sabor), que sí se disuelven poco a poco. Por eso, después de un rato, solo queda esa base sin sabor.",deepen:["La base de goma del chicle moderno se hace con polímeros sintéticos parecidos al plástico o el caucho, elegidos justo porque no se disuelven con la saliva ni se digieren en el estómago. Antes, los chicles se hacían con chicle natural de árbol (de donde viene el nombre), una savia espesa con una propiedad muy parecida.","Aunque tragar un chicle accidentalmente no es tan peligroso como dice el mito de que 'tarda siete años en digerirse', tu cuerpo tampoco puede descomponerlo como hace con la comida — simplemente pasa por el sistema digestivo sin cambios y sale igual que entró, generalmente en un par de días."]},

  {id:"en1",cat:"Inglés",title:"Los colores en inglés",body:"'Red' es rojo, 'blue' es azul, 'yellow' es amarillo, 'green' es verde, y 'black' y 'white' son negro y blanco. Aprenderlos es más fácil si vas señalando objetos de esos colores mientras los dices en voz alta.",deepen:["El inglés, igual que el español, tiene palabras para tonos más específicos además de los colores básicos: 'navy' es azul marino, 'maroon' es un rojo oscuro, y 'teal' es un verde azulado. Aprender primero los colores básicos te da una base sólida antes de sumar esos tonos más específicos.","Una forma divertida de practicar en casa es jugar a 'veo veo' (en inglés 'I spy') usando solo los colores: 'I spy something blue' (veo algo azul), y que el resto de la familia adivine qué objeto es — así se practica vocabulario sin que se sienta como tarea."]},
  {id:"en2",cat:"Inglés",title:"Los días de la semana en inglés",body:"Empiezan con 'Sunday' (domingo) y siguen con 'Monday' (lunes), 'Tuesday' (martes), 'Wednesday' (miércoles), 'Thursday' (jueves), 'Friday' (viernes) y 'Saturday' (sábado). En inglés, la semana en el calendario suele empezar en domingo, no en lunes.",deepen:["Los nombres de los días en inglés vienen de nombres antiguos relacionados con el sol, la luna y dioses nórdicos: 'Sunday' viene de 'día del sol', 'Monday' de 'día de la luna', y 'Thursday' viene de Thor, el dios nórdico del trueno.","En muchos calendarios de países de habla inglesa, la semana efectivamente empieza en domingo (a diferencia de los calendarios en español, que suelen empezar en lunes), lo cual puede resultar confuso al usar una agenda o app en inglés por primera vez."]},
  {id:"en3",cat:"Inglés",title:"Cómo pedir comida en inglés",body:"'I would like...' (me gustaría...) es una forma educada de pedir algo, como en 'I would like a water, please' (me gustaría un agua, por favor). También es muy útil 'Can I have...?' (¿me puede dar...?) para pedir algo de forma directa y amable.",deepen:["En inglés existen distintos niveles de formalidad para pedir algo: 'Give me water' (dame agua) suena brusco y poco educado, mientras que 'Could I have some water, please?' (¿podría tener algo de agua, por favor?) es mucho más cortés — parecido a la diferencia entre 'dame eso' y 'me podrías dar eso, por favor' en español.","Una palabra clave en cualquier país de habla inglesa es 'please' (por favor): agregarla casi siempre suaviza cualquier petición, incluso una frase simple como 'Water, please' (agua, por favor) ya suena razonablemente educada."]},
  {id:"en4",cat:"Inglés",title:"Cómo se forma el plural en inglés",body:"La mayoría de las palabras solo agregan una 's' al final, como 'cat' → 'cats' (gatos). Pero si la palabra termina en sonidos como 'ch', 'sh', 's' o 'x', se le agrega 'es', como en 'box' → 'boxes' (cajas).",deepen:["Además de la regla de agregar 's' o 'es', el inglés tiene varias palabras con plurales irregulares que no siguen ninguna regla y hay que memorizar aparte, como 'child' → 'children' (niño/niños), 'man' → 'men' (hombre/hombres), o 'foot' → 'feet' (pie/pies).","Algunas palabras en inglés incluso tienen la misma forma en singular y plural, como 'sheep' (oveja/ovejas) o 'fish' (pez/peces) — dependes del contexto de la oración para saber si se habla de uno o de varios."]},
  {id:"en5",cat:"Inglés",title:"Cómo decir la hora en inglés",body:"Para decir 'son las tres' dices 'it's three o'clock', y para 'las tres y media' dices 'it's half past three'. 'O'clock' se usa solo cuando es la hora exacta, sin minutos de más.",deepen:["Para los minutos que no son la media o la hora exacta, en inglés se suele decir el minuto seguido de 'past' (después de) o 'to' (para/antes de), por ejemplo 'ten past three' (las tres y diez) o 'ten to four' (diez para las cuatro / tres cincuenta).","En muchos países de habla inglesa, especialmente en Estados Unidos, es más común usar el reloj de 12 horas con 'AM' y 'PM' en vez del formato de 24 horas, así que hay que aclarar si algo es por la mañana o por la noche al decir la hora."]},

  {id:"bi1",cat:"Versículos Bíblicos",title:"Génesis 1:1",body:"'En el principio creó Dios los cielos y la tierra.' Es el primer versículo de toda la Biblia, y presenta la idea de que todo lo que existe tuvo un comienzo y un creador.",deepen:["Génesis es el primer libro de la Biblia, y su nombre significa 'origen' o 'principio'. Este primer versículo abre todo el relato bíblico estableciendo la idea central que atraviesa el resto del libro: que existe un orden y un propósito detrás de la creación del mundo.","Este versículo se ha traducido a miles de idiomas alrededor del mundo, y por ser la primera línea de todo el texto, es una de las frases más citadas y conocidas de toda la literatura religiosa de la historia."]},
  {id:"bi2",cat:"Versículos Bíblicos",title:"Salmo 46:1",body:"'Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.' Habla de sentir que hay un lugar seguro al cual acudir cuando las cosas se ponen difíciles.",deepen:["Los Salmos son una colección de 150 poemas y cantos, escritos por distintos autores a lo largo de muchos siglos, pensados originalmente para cantarse en momentos de oración o celebración — no para leerse en silencio como un texto normal.","El Salmo 46 en particular se piensa que fue escrito en un momento de gran dificultad o amenaza para su pueblo, y por eso su mensaje de refugio y fortaleza ha sido citado durante siglos como consuelo en tiempos de crisis, incluyendo por músicos famosos que compusieron himnos inspirados directamente en él."]},
  {id:"bi3",cat:"Versículos Bíblicos",title:"Mateo 7:12 (la Regla de Oro)",body:"'Así que, todas las cosas que queráis que los hombres hagan con vosotros, así también haced vosotros con ellos.' Es una de las enseñanzas más conocidas de toda la Biblia: tratar a los demás como te gustaría que te trataran a ti.",deepen:["Esta frase de Mateo 7:12 se conoce popularmente como la 'Regla de Oro', y versiones muy parecidas de esta misma idea —tratar a otros como quieres ser tratado— aparecen también en otras religiones y filosofías del mundo, como el budismo, el confucianismo y el judaísmo, cada una a su manera y en épocas distintas.","Que una idea tan parecida haya surgido de forma independiente en culturas tan distintas y lejanas entre sí es algo que muchos estudiosos consideran señal de que se trata de un principio moral casi universal, más allá de una sola tradición religiosa."]},
  {id:"bi4",cat:"Versículos Bíblicos",title:"1 Corintios 13:4",body:"'El amor es paciente, es bondadoso. El amor no tiene envidia, no se jacta, no se envanece.' Es parte de una descripción muy conocida sobre cómo se ve el amor verdadero en la forma de actuar día a día.",deepen:["Este pasaje de 1 Corintios 13 fue escrito por el apóstol Pablo como parte de una carta a una comunidad en la ciudad de Corinto, que en ese momento tenía conflictos internos — el pasaje sobre el amor se usó como un llamado a la unidad y la paciencia entre personas que no siempre estaban de acuerdo.","Por su forma poética y su mensaje universal sobre cómo tratarse entre las personas, este capítulo es uno de los más leídos en bodas y ceremonias alrededor del mundo, incluso fuera de contextos estrictamente religiosos."]},
  {id:"bi5",cat:"Versículos Bíblicos",title:"Eclesiastés 3:1",body:"'Todo tiene su tiempo, y todo lo que se quiere debajo del cielo tiene su hora.' Recuerda que en la vida hay momentos distintos para cada cosa, y que está bien que las etapas cambien.",deepen:["Eclesiastés es un libro que reflexiona sobre el sentido de la vida, escrito con un tono más filosófico que el resto de la Biblia. El pasaje de 'todo tiene su tiempo' continúa con una lista de opuestos — tiempo de nacer y de morir, de plantar y de cosechar — como forma poética de mostrar que la vida está hecha de ciclos y etapas distintas.","Esta idea de que 'todo tiene su tiempo' ha inspirado canciones, libros y discursos fuera del ámbito religioso a lo largo de los siglos, precisamente porque describe algo que cualquier persona, de cualquier creencia, puede reconocer en su propia vida."]},
];

  const query = NASA_QUERIES[planetId];
  if (!query) return;
  planetPhotoRequests[planetId] = true;
  fetch(`https://images-api.nasa.gov/search?q=${encodeURIComponent(query)}&media_type=image&page_size=1`)
    .then(r => r.json())
    .then(data => {

/* ---- Shared realistic planet rendering (used by avatars, the big profile scene, and the solar view) ---- */
function appendRingPair(container, cx, cy, rx, ry, rotDeg, color, opacity, strokeWidth) {
  const ns = "http://www.w3.org/2000/svg";
  const bands = [
    { rx, ry, op: opacity, w: strokeWidth },
    { rx: rx*0.86, ry: ry*0.86, op: opacity*0.65, w: strokeWidth*0.65 },
  ];
  const fronts = [];
  bands.forEach(b => {
    const back = document.createElementNS(ns,"ellipse");
    back.setAttribute("cx",cx); back.setAttribute("cy",cy);
    back.setAttribute("rx",b.rx); back.setAttribute("ry",b.ry);
    back.setAttribute("fill","none"); back.setAttribute("stroke",color);
    back.setAttribute("stroke-opacity", b.op); back.setAttribute("stroke-width", b.w);
    back.setAttribute("transform", `rotate(${rotDeg} ${cx} ${cy})`);
    container.appendChild(back);

    const front = document.createElementNS(ns,"path");
    front.setAttribute("d", `M ${cx+b.rx} ${cy} A ${b.rx} ${b.ry} 0 0 1 ${cx-b.rx} ${cy}`);
    front.setAttribute("fill","none"); front.setAttribute("stroke",color);
    front.setAttribute("stroke-opacity", Math.min(b.op*1.4, 0.9)); front.setAttribute("stroke-width", b.w);
    front.setAttribute("transform", `rotate(${rotDeg} ${cx} ${cy})`);
    fronts.push(front);
  });
  return fronts; // caller appends these AFTER the planet disk so the ring wraps in front too
}

function paintPlanetDisk(container, defs, p, cx, cy, r, idPrefix, animated) {
  const ns = "http://www.w3.org/2000/svg";
  const usePhoto = !!(p.realPlanetId && planetPhotoCache[p.realPlanetId]);
  const style = p.style || "bands";

  const glowId = idPrefix+"-atmo-"+p.id;
  const glow = document.createElementNS(ns,"radialGradient");
  glow.setAttribute("id", glowId);
  glow.innerHTML = `<stop offset="55%" stop-color="${p.color}" stop-opacity="0"/><stop offset="82%" stop-color="${p.color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${p.color}" stop-opacity="0"/>`;
  defs.appendChild(glow);
  const atmo = document.createElementNS(ns,"circle");
  atmo.setAttribute("cx",cx); atmo.setAttribute("cy",cy); atmo.setAttribute("r", r*1.3);
  atmo.setAttribute("fill", `url(#${glowId})`);
  container.appendChild(atmo);

  let fillRef;
  if (usePhoto) {
    const patId = idPrefix+"-photo-"+p.id;
    const pattern = document.createElementNS(ns,"pattern");
    pattern.setAttribute("id", patId);
    pattern.setAttribute("patternUnits","objectBoundingBox");
    pattern.setAttribute("width","1"); pattern.setAttribute("height","1");
    const image = document.createElementNS(ns,"image");
    image.setAttributeNS("http://www.w3.org/1999/xlink","href", planetPhotoCache[p.realPlanetId]);
    image.setAttribute("href", planetPhotoCache[p.realPlanetId]);
    image.setAttribute("x","0"); image.setAttribute("y","0");
    image.setAttribute("width","1"); image.setAttribute("height","1");
    image.setAttribute("preserveAspectRatio","xMidYMid slice");
    pattern.appendChild(image);
    defs.appendChild(pattern);
    fillRef = `url(#${patId})`;
  } else {
    const gradId = idPrefix+"-grad-"+p.id;
    const grad = document.createElementNS(ns,"radialGradient");
    grad.setAttribute("id", gradId);
    grad.setAttribute("cx","33%"); grad.setAttribute("cy","30%"); grad.setAttribute("r","78%");
    grad.innerHTML = `<stop offset="0%" stop-color="#fff" stop-opacity="0.9"/><stop offset="30%" stop-color="${p.color}"/><stop offset="100%" stop-color="#1c1846"/>`;
    defs.appendChild(grad);
    fillRef = `url(#${gradId})`;
  }
  const planet = document.createElementNS(ns,"circle");
  planet.setAttribute("cx",cx); planet.setAttribute("cy",cy); planet.setAttribute("r",r);
  planet.setAttribute("fill", fillRef);
  container.appendChild(planet);

  const clipId = idPrefix+"-clip-"+p.id;
  const clip = document.createElementNS(ns,"clipPath");
  clip.setAttribute("id", clipId);
  const clipCircle = document.createElementNS(ns,"circle");
  clipCircle.setAttribute("cx",cx); clipCircle.setAttribute("cy",cy); clipCircle.setAttribute("r",r);
  clip.appendChild(clipCircle);
  defs.appendChild(clip);

  if (!usePhoto) {
    const texGroup = document.createElementNS(ns,"g");
    texGroup.setAttribute("clip-path", `url(#${clipId})`);
    if (animated) texGroup.setAttribute("class", style === "lava" ? "planet-halo" : "planet-band");
    if (style === "bands") {
      [0,1,2].forEach(i => {
        const band = document.createElementNS(ns,"ellipse");
        band.setAttribute("cx", cx + (i-1)*r*0.45); band.setAttribute("cy", cy - r*0.22 + i*r*0.32);
        band.setAttribute("rx", r*1.15); band.setAttribute("ry", r*0.22);
        band.setAttribute("fill","#fff"); band.setAttribute("opacity", 0.06 + i*0.03);
        texGroup.appendChild(band);
      });
    } else if (style === "rocky") {
      const craterCount = animated ? 16 : 10;
      for (let i=0;i<craterCount;i++) {
        const h1 = hash("rock"+p.id+i), h2 = hash("rockY"+p.id+i);
        const rx = cx - r + (h1 % Math.round(r*2)), ry = cy - r + (h2 % Math.round(r*2));
        const crater = document.createElementNS(ns,"circle");
        crater.setAttribute("cx",rx); crater.setAttribute("cy",ry); crater.setAttribute("r", 2 + (h1%4));
        crater.setAttribute("fill","#000"); crater.setAttribute("opacity", 0.1 + (h2%10)/100);
        texGroup.appendChild(crater);
      }
    } else if (style === "crystal") {
      const lineCount = animated ? 9 : 6;
      for (let i=0;i<lineCount;i++) {
        const angle = (i / lineCount) * Math.PI * 2;
        const line = document.createElementNS(ns,"line");
        line.setAttribute("x1",cx); line.setAttribute("y1",cy);
        line.setAttribute("x2", cx + Math.cos(angle)*r); line.setAttribute("y2", cy + Math.sin(angle)*r);
        line.setAttribute("stroke","#fff"); line.setAttribute("stroke-width","1"); line.setAttribute("opacity","0.22");
        texGroup.appendChild(line);
      }
    } else if (style === "lava") {
      [0,1,2].forEach(i => {
        const blob = document.createElementNS(ns,"ellipse");
        blob.setAttribute("cx", cx + (i-1)*r*0.36); blob.setAttribute("cy", cy + (i-1)*r*0.22);
        blob.setAttribute("rx", r*0.6); blob.setAttribute("ry", r*0.32);
        blob.setAttribute("fill","#fff2c2"); blob.setAttribute("opacity", 0.12 + i*0.05);
        texGroup.appendChild(blob);
      });
    }
    container.appendChild(texGroup);
  }

  const showClouds = usePhoto || style === "bands";
  if (showClouds) {
    const cloudGroup = document.createElementNS(ns,"g");
    cloudGroup.setAttribute("clip-path", `url(#${clipId})`);
    if (animated) cloudGroup.setAttribute("class","planet-clouds");
    const ch1 = hash("cloud"+p.id), ch2 = hash("cloudB"+p.id);
    [0,1,2].forEach(i => {
      const wx = cx - r*0.6 + ((ch1+i*137) % Math.round(r*1.8));
      const wy = cy - r*0.6 + ((ch2+i*211) % Math.round(r*1.8));
      const wisp = document.createElementNS(ns,"ellipse");
      wisp.setAttribute("cx", wx); wisp.setAttribute("cy", wy);
      wisp.setAttribute("rx", r*0.42); wisp.setAttribute("ry", r*0.16);
      wisp.setAttribute("fill","#fff"); wisp.setAttribute("opacity","0.16");
      wisp.setAttribute("transform", `rotate(${(i*37)%360} ${wx} ${wy})`);
      cloudGroup.appendChild(wisp);
    });
    container.appendChild(cloudGroup);
  }

  const shadeId = idPrefix+"-shade-"+p.id;
  const shadeGrad = document.createElementNS(ns,"radialGradient");
  shadeGrad.setAttribute("id", shadeId);
  shadeGrad.setAttribute("cx","72%"); shadeGrad.setAttribute("cy","75%"); shadeGrad.setAttribute("r","68%");
  shadeGrad.innerHTML = `<stop offset="0%" stop-color="#000" stop-opacity="0.58"/><stop offset="65%" stop-color="#000" stop-opacity="0.1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>`;
  defs.appendChild(shadeGrad);
  const shade = document.createElementNS(ns,"circle");
  shade.setAttribute("cx",cx); shade.setAttribute("cy",cy); shade.setAttribute("r",r);
  shade.setAttribute("fill", `url(#${shadeId})`);
  container.appendChild(shade);

  const specId = idPrefix+"-spec-"+p.id;
  const specGrad = document.createElementNS(ns,"radialGradient");
  specGrad.setAttribute("id", specId);
  specGrad.innerHTML = `<stop offset="0%" stop-color="#fff" stop-opacity="0.55"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>`;
  defs.appendChild(specGrad);
  const spec = document.createElementNS(ns,"ellipse");
  const specCx = cx - r*0.32, specCy = cy - r*0.34;
  spec.setAttribute("cx", specCx); spec.setAttribute("cy", specCy);
  spec.setAttribute("rx", r*0.28); spec.setAttribute("ry", r*0.18);
  spec.setAttribute("fill", `url(#${specId})`);
  spec.setAttribute("transform", `rotate(-28 ${specCx} ${specCy})`);
  spec.style.mixBlendMode = "screen";
  container.appendChild(spec);

  const rimGlow = document.createElementNS(ns,"circle");
  rimGlow.setAttribute("cx",cx); rimGlow.setAttribute("cy",cy); rimGlow.setAttribute("r", r + r*0.05);
  rimGlow.setAttribute("fill","none"); rimGlow.setAttribute("stroke", p.color);
  rimGlow.setAttribute("stroke-opacity","0.25"); rimGlow.setAttribute("stroke-width", Math.max(2, r*0.05));
  container.appendChild(rimGlow);
  const rim = document.createElementNS(ns,"circle");
  rim.setAttribute("cx",cx); rim.setAttribute("cy",cy); rim.setAttribute("r",r+0.5);
  rim.setAttribute("fill","none"); rim.setAttribute("stroke", p.color); rim.setAttribute("stroke-opacity","0.55"); rim.setAttribute("stroke-width","1");
  container.appendChild(rim);
}

function buildPlanetAvatar(p) {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.style.display = "block";
  const cx = 50, cy = 50, r = 36;
  const defs = document.createElementNS(ns,"defs");
  svg.appendChild(defs);

  const learnedCount = (p.unlocked || []).length;
  let ringFronts = [];
  if (p.forceRing || learnedCount >= 10) {
    const rotDeg = (hash("ringrot"+p.id) % 40) - 20;
    ringFronts = appendRingPair(svg, cx, cy, r+13, (r+13)*0.28, rotDeg, p.color, 0.5, 2.4);
  }

  paintPlanetDisk(svg, defs, p, cx, cy, r, "av", false);

  ringFronts.forEach(f => svg.appendChild(f));

  return svg;
}

/* ---- Solar system view (Cambio 1: vista sistema familiar) ---- */
const prefersReducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let solarActive = false;
let solarRafId = null;
let solarPaused = false;
let solarSelectedId = null;
let solarClock = 0;
let solarLastTs = null;
let solarCam = { s: 1, tx: 0, ty: 0 };
let solarCamTarget = { s: 1, tx: 0, ty: 0 };
let solarPlanetsById = {};
let solarViewportW = 0, solarViewportH = 0;
let solarStarCtx = null;
let solarSceneEl = null, solarLabelsEl = null, solarOrbitsSvgEl = null;
let solarOnResize = null, solarOnVisibility = null;
let solarMoonEls = [];
let solarMoonsFor = null;
let solarBottomBarFor = null;
let hasLandedThisSession = false;

function goLanding() {
  renderSolarSystem();
}

function teardownSolarIfActive() {
  if (!solarActive) return;
  solarActive = false;
  if (solarRafId) cancelAnimationFrame(solarRafId);
  solarRafId = null;
  if (solarOnResize) window.removeEventListener('resize', solarOnResize);
  if (solarOnVisibility) document.removeEventListener('visibilitychange', solarOnVisibility);
  solarOnResize = null; solarOnVisibility = null;
  solarPlanetsById = {};
  solarSelectedId = null;
  solarMoonEls = [];
  solarMoonsFor = null;
  solarBottomBarFor = null;
  solarLastTs = null;
}

function orbitParamsFor(profileId, index) {
  const h1 = hash(profileId+"-a"), h2 = hash(profileId+"-b"), h3 = hash(profileId+"-r"), h4 = hash(profileId+"-o"), h5 = hash(profileId+"-p");
  const a = 130 + index*68 + (h1 % 30);
  const b = a * (0.5 + (h2 % 20)/100);
  const rot = ((h3 % 360) * Math.PI/180) * 0.35;
  const angleOffset = (h4 % 360) * Math.PI/180;
  const period = 34 + (a/160)*26 + (h5 % 10);
  return { a, b, rot, angleOffset, period };
}

function planetPositionAt(orb, t) {
  const angle = orb.angleOffset + (prefersReducedMotion ? 0 : (t / orb.period) * Math.PI * 2);
  const x0 = Math.cos(angle) * orb.a;
  const y0 = Math.sin(angle) * orb.b;
  const cosR = Math.cos(orb.rot), sinR = Math.sin(orb.rot);
  return {
    x: 500 + x0*cosR - y0*sinR,
    y: 500 + x0*sinR + y0*cosR,
  };
}

function syncSolarPlanets() {
  if (!solarSceneEl) return;
  const seen = {};
  profiles.forEach((rawP, i) => {
    const p = ensureProfileDefaults(rawP);
    if (p.realPlanetId) ensurePlanetPhoto(p.realPlanetId);
    seen[p.id] = true;
    let entry = solarPlanetsById[p.id];
    if (!entry) {
      const orb = orbitParamsFor(p.id, i);
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:0;top:0;width:64px;height:64px;cursor:pointer;';
      solarSceneEl.appendChild(wrap);
      const label = document.createElement('div');
      label.className = 'solar-label';
      solarLabelsEl.appendChild(label);
      const connector = document.createElement('div');
      connector.style.cssText = 'position:absolute;width:1px;height:8px;background:var(--muted);opacity:0.55;pointer-events:none;';
      solarLabelsEl.appendChild(connector);
      entry = { orb, wrap, label, connector, p };
      solarPlanetsById[p.id] = entry;
      wrap.onclick = (e) => { e.stopPropagation(); solarSelectedId = p.id; };
    }
    entry.p = p;
    entry.wrap.innerHTML = '';
    const svg = buildPlanetAvatar(p);
    svg.style.width = '100%'; svg.style.height = '100%';
    entry.wrap.appendChild(svg);
    entry.label.textContent = p.name;
  });
  Object.keys(solarPlanetsById).forEach(id => {
    if (!seen[id]) {
      solarPlanetsById[id].wrap.remove();
      solarPlanetsById[id].label.remove();
      solarPlanetsById[id].connector.remove();
      delete solarPlanetsById[id];
      if (solarSelectedId === id) solarSelectedId = null;
    }
  });
  if (solarOrbitsSvgEl) drawSolarOrbits(solarOrbitsSvgEl);
}

function paintSolarStars() {
  if (!solarStarCtx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = solarViewportW, h = solarViewportH;
  const canvas = solarStarCtx.canvas;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  solarStarCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  solarStarCtx.clearRect(0, 0, w, h);
  const n = Math.round((w*h)/3400);
  for (let i=0;i<n;i++) {
    const x = Math.random()*w, y = Math.random()*h;
    const r = Math.random()*1.3 + 0.3;
    solarStarCtx.beginPath();
    solarStarCtx.arc(x, y, r, 0, Math.PI*2);
    solarStarCtx.fillStyle = 'rgba(255,255,255,'+(0.35+Math.random()*0.5).toFixed(2)+')';
    solarStarCtx.fill();
  }
}

function drawSolarOrbits(svgEl) {
  svgEl.innerHTML = '';
  const ns = "http://www.w3.org/2000/svg";
  Object.values(solarPlanetsById).forEach(entry => {
    const orbitEl = document.createElementNS(ns, 'ellipse');
    orbitEl.setAttribute('cx', 500); orbitEl.setAttribute('cy', 500);
    orbitEl.setAttribute('rx', entry.orb.a); orbitEl.setAttribute('ry', entry.orb.b);
    orbitEl.setAttribute('fill', 'none');
    orbitEl.setAttribute('stroke', entry.p.color);
    orbitEl.setAttribute('stroke-opacity', '0.3');
    orbitEl.setAttribute('stroke-width', '1.4');
    orbitEl.setAttribute('transform', `rotate(${entry.orb.rot*180/Math.PI} 500 500)`);
    svgEl.appendChild(orbitEl);
  });
}

function updateSolarCameraTarget() {
  const fitScale = Math.min(solarViewportW, solarViewportH) / 1150;
  if (solarSelectedId && solarPlanetsById[solarSelectedId]) {
    const entry = solarPlanetsById[solarSelectedId];
    const pos = planetPositionAt(entry.orb, solarClock);
    const zoomScale = Math.max(fitScale * 7, 2.4);
    solarCamTarget.s = zoomScale;
    solarCamTarget.tx = solarViewportW/2 - pos.x*zoomScale;
    solarCamTarget.ty = solarViewportH/2 - pos.y*zoomScale;
  } else {
    solarCamTarget.s = fitScale;
    solarCamTarget.tx = solarViewportW/2 - 500*fitScale;
    solarCamTarget.ty = solarViewportH/2 - 500*fitScale;
  }
}

function renderSolarBottomBar() {
  const bar = document.getElementById('solarBottomBar');
  if (!bar) return;
  if (!solarSelectedId || !solarPlanetsById[solarSelectedId]) {
    bar.style.display = 'none';
    solarBottomBarFor = null;
    return;
  }
  bar.style.display = 'block';
  if (solarBottomBarFor === solarSelectedId) return;
  const entry = solarPlanetsById[solarSelectedId];
  const p = entry.p;
  const bonusIds = p.bonusMoons || [];
  const totalMoonCount = (p.unlocked||[]).length + bonusIds.length;
  bar.innerHTML = '';
  bar.appendChild(el(`
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;">
      <h2 style="font-size:19px;">${p.name}</h2>
      <span style="color:var(--muted);font-size:13px;">🌙 ${totalMoonCount}</span>
    </div>
  `));
  const learned = (p.unlocked||[]).map(id => TOPICS.find(t=>t.id===id)).filter(Boolean);
  const bonusTopics = bonusIds.map(id => TOPICS.find(t=>t.id===id)).filter(Boolean);
  const chipsWrap = el(`<div style="display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;justify-content:${learned.length?'flex-start':'center'};"></div>`);
  if (learned.length === 0) {
    chipsWrap.appendChild(el(`<div style="color:var(--muted);font-size:12.5px;">Aún sin lunas</div>`));
  } else {
    learned.forEach(t => {
      chipsWrap.appendChild(el(`<div style="flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:11.5px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,0.3);">${t.title}</div>`));
    });
    bonusTopics.forEach(t => {
      chipsWrap.appendChild(el(`<div style="flex:0 0 auto;background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:6px 12px;font-size:11.5px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,0.3);color:var(--gold);">⭐ ${t.title}</div>`));
    });
  }
  bar.appendChild(chipsWrap);
  const actions = el(`<div style="display:flex;gap:10px;justify-content:center;margin-top:8px;"></div>`);
  const openBtn = el(`<button class="solar-btn">Ver perfil completo →</button>`);
  openBtn.onclick = () => { currentProfileId = p.id; renderProfile(); };
  actions.appendChild(openBtn);
  bar.appendChild(actions);
  solarBottomBarFor = solarSelectedId;
}

function renderSolarMoons() {
  const container = document.getElementById('solarMoonsLayer');
  if (!container) return;
  if (!solarSelectedId || !solarPlanetsById[solarSelectedId]) {
    if (solarMoonEls.length) { solarMoonEls.forEach(m=>{ m.wrap.remove(); m.label.remove(); }); solarMoonEls = []; }
    solarMoonsFor = null;
    return;
  }
  const entry = solarPlanetsById[solarSelectedId];
  const p = entry.p;
  const learned = (p.unlocked || []).map(id => ({ topic: TOPICS.find(t=>t.id===id), bonus: false })).filter(m=>m.topic);
  const bonusMoons = (p.bonusMoons || []).map(id => ({ topic: TOPICS.find(t=>t.id===id), bonus: true })).filter(m=>m.topic);
  const allMoons = learned.concat(bonusMoons);
  const pos = planetPositionAt(entry.orb, solarClock);
  const screenX = solarCam.tx + pos.x*solarCam.s;
  const screenY = solarCam.ty + pos.y*solarCam.s;

  if (solarMoonsFor !== solarSelectedId || solarMoonEls.length !== allMoons.length) {
    solarMoonEls.forEach(m=>{ m.wrap.remove(); m.label.remove(); });
    solarMoonEls = allMoons.map(() => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;';
      const label = document.createElement('div');
      label.className = 'solar-moon-label';
      container.appendChild(wrap);
      container.appendChild(label);
      return { wrap, label };
    });
    solarMoonsFor = solarSelectedId;
  }

  const radius = 78;
  allMoons.forEach((moonInfo, i) => {
    const angle = (i/Math.max(allMoons.length,1)) * Math.PI*2 + solarClock*(prefersReducedMotion?0:0.4);
    const mx = screenX + Math.cos(angle)*radius;
    const my = screenY + Math.sin(angle)*radius*0.6;
    const m = solarMoonEls[i];
    const moonColor = moonInfo.bonus ? '#ffe27a' : p.color;
    m.wrap.style.left = (mx-5)+'px'; m.wrap.style.top = (my-5)+'px';
    m.wrap.style.background = moonColor;
    m.wrap.style.boxShadow = `0 0 8px ${moonColor}`;
    m.label.style.left = mx+'px'; m.label.style.top = (my+8)+'px';
    m.label.style.color = moonInfo.bonus ? 'var(--gold)' : '';
    m.label.textContent = (moonInfo.bonus ? '⭐ ' : '') + moonInfo.topic.title;
  });
}

function solarFrame(ts) {
  if (!solarActive) return;
  if (solarLastTs == null) solarLastTs = ts;
  const dt = Math.min((ts - solarLastTs)/1000, 0.1);
  solarLastTs = ts;
  if (!solarPaused) solarClock += dt;

  updateSolarCameraTarget();
  const lerp = prefersReducedMotion ? 1 : 0.1;
  solarCam.s += (solarCamTarget.s - solarCam.s) * lerp;
  solarCam.tx += (solarCamTarget.tx - solarCam.tx) * lerp;
  solarCam.ty += (solarCamTarget.ty - solarCam.ty) * lerp;

  solarSceneEl.style.transform = `translate(${solarCam.tx}px, ${solarCam.ty}px) scale(${solarCam.s})`;

  const showLabels = !solarSelectedId;
  Object.values(solarPlanetsById).forEach(entry => {
    const pos = planetPositionAt(entry.orb, solarClock);
    entry.wrap.style.transform = `translate(${pos.x - 32}px, ${pos.y - 32}px)`;
    const screenX = solarCam.tx + pos.x*solarCam.s;
    const screenY = solarCam.ty + pos.y*solarCam.s;
    const apparentR = 32*solarCam.s;
    entry.label.style.display = showLabels ? 'block' : 'none';
    entry.connector.style.display = showLabels ? 'block' : 'none';
    if (showLabels) {
      entry.label.style.left = screenX + 'px';
      entry.label.style.top = (screenY + apparentR + 8) + 'px';
      entry.connector.style.left = (screenX - 0.5) + 'px';
      entry.connector.style.top = (screenY + apparentR) + 'px';
    }
  });

  renderSolarBottomBar();
  renderSolarMoons();

  solarRafId = requestAnimationFrame(solarFrame);
}

    const name = overlay.querySelector('.name-input').value.trim();

    const newProfile = { id: 'p'+Date.now(), name, color: chosenColor, style: 'bands', forceRing: false, realPlanetId: null, unlocked: [], bonusMoons: [], streak: 0, lastActive: null, seenBadges: [], activityLog: {} };
    profiles.push(newProfile);
    saveProfiles(profiles);
    overlay.remove();
    renderSolarSystem();
  };
  document.body.appendChild(overlay);
}

function ensureProfileDefaults(p) {
  if (!p.style) p.style = 'bands';
  if (!p.seenBadges) p.seenBadges = [];
  if (p.forceRing === undefined) p.forceRing = false;
  if (!p.activityLog) p.activityLog = {};
  if (p.realPlanetId === undefined) p.realPlanetId = null;
  if (!p.bonusMoons) p.bonusMoons = [];
  return p;
}

function getProfile() {
  const p = profiles.find(p => p.id === currentProfileId);
  return p ? ensureProfileDefaults(p) : p;
}

function buildPlanetScene(p) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 400 260");
  svg.setAttribute("width","100%");
  svg.style.display = "block";
  const ns = svg.namespaceURI;
  const cx = 200, cy = 130, r = 44;

  // background stars
  for (let i=0;i<40;i++) {
    const h = hash("bg"+i);
    const bx = h % 400, by = (h*7) % 260, sr = 0.6 + (h % 3)*0.3;
    const dot = document.createElementNS(ns,"circle");
    dot.setAttribute("cx",bx); dot.setAttribute("cy",by); dot.setAttribute("r",sr);
    dot.setAttribute("fill","#4a4480"); dot.setAttribute("opacity","0.5");
    svg.appendChild(dot);
  }

  const defs = document.createElementNS(ns,"defs");
  svg.appendChild(defs);

  const learnedCount = p.unlocked.length;
  const ringRotDeg = (hash("ringrot"+p.id) % 30) - 15;
  let ringFronts = [];
  if (learnedCount >= 20) {
    ringFronts = ringFronts.concat(appendRingPair(svg, cx, cy, 92, 22, ringRotDeg, p.color, 0.3, 1.6));
  }
  if (learnedCount >= 10 || p.forceRing) {
    ringFronts = ringFronts.concat(appendRingPair(svg, cx, cy, 76, 17, ringRotDeg, p.color, 0.45, 1.8));
  }

  // glow halo (ambient, pulses)
  const halo = document.createElementNS(ns,"circle");
  halo.setAttribute("cx",cx); halo.setAttribute("cy",cy); halo.setAttribute("r","62");
  halo.setAttribute("fill",p.color); halo.setAttribute("class","planet-halo");
  svg.appendChild(halo);

  paintPlanetDisk(svg, defs, p, cx, cy, r, "sc", true);

  ringFronts.forEach(f => svg.appendChild(f));

  // orbiting moons (one per unlocked topic, plus extra gold ones for hard-quiz bonuses)
  const bonusMoons = p.bonusMoons || [];
  const allMoons = [...p.unlocked.map(id => ({ id, bonus: false })), ...bonusMoons.map(id => ({ id, bonus: true }))];
  if (allMoons.length > 0) {
    const totalMoonCount = allMoons.length;
    const orbitGroup = document.createElementNS(ns,"g");
    orbitGroup.setAttribute("class","orbit-group");
    allMoons.forEach((m, i) => {
      const shell = Math.floor(i / 8);
      const inShellIndex = i % 8;
      const inShellCount = Math.min(8, totalMoonCount - shell*8);
      const radius = 70 + shell*20;
      const angle = (inShellIndex / inShellCount) * Math.PI * 2 + shell*0.4;
      const mx = cx + Math.cos(angle) * radius;
      const my = cy + Math.sin(angle) * radius * 0.55;
      const moonColor = m.bonus ? '#ffe27a' : p.color;
      const moon = document.createElementNS(ns,"circle");
      moon.setAttribute("cx",mx); moon.setAttribute("cy",my); moon.setAttribute("r", m.bonus ? "5" : "4");
      moon.setAttribute("fill", moonColor);
      orbitGroup.appendChild(moon);
      const moonGlow = document.createElementNS(ns,"circle");
      moonGlow.setAttribute("cx",mx); moonGlow.setAttribute("cy",my); moonGlow.setAttribute("r", m.bonus ? "9" : "7");
      moonGlow.setAttribute("fill", moonColor); moonGlow.setAttribute("opacity", m.bonus ? "0.4" : "0.25");
      orbitGroup.insertBefore(moonGlow, moon);
    });
    svg.appendChild(orbitGroup);
  } else {
    const txt = document.createElementNS(ns,"text");
    txt.setAttribute("x", cx); txt.setAttribute("y", 220);
    txt.setAttribute("text-anchor","middle");
    txt.setAttribute("fill","#7a72ab");
    txt.setAttribute("font-size","12.5");
    txt.setAttribute("font-family","Sora, sans-serif");
    txt.textContent = "Aún sin lunas — descubre algo para ganar la primera";
    svg.appendChild(txt);
  }

  return svg;
}

function showQuizSheet(p, t, noteText) {
  const quiz = QUIZZES[t.id];
  if (!quiz) { proceedAfterQuiz(p, t, noteText, null); return; }

  const overlay = el(`
    <div class="overlay">
      <div class="sheet detail-card">
        <button class="sheet-close">✕</button>
        <div class="eyebrow">Pregunta rápida</div>
        <h2 style="font-size:18px;margin:8px 0 16px;">${quiz.q}</h2>
        <div id="quizOptions"></div>
      </div>
    </div>
  `);
  overlay.querySelector('.sheet-close').onclick = () => { overlay.remove(); proceedAfterQuiz(p, t, noteText, null); };
  overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); proceedAfterQuiz(p, t, noteText, null); } };

  const optionsWrap = overlay.querySelector('#quizOptions');
  quiz.options.forEach((opt, i) => {
    const btn = el(`<div class="cat-item" style="cursor:pointer;"><span class="cat-item-name">${opt}</span></div>`);
    btn.onclick = () => {
      const correct = i === quiz.correct;
      optionsWrap.querySelectorAll('.cat-item').forEach((it, j) => {
        it.style.cursor = 'default';
        it.onclick = null;
        if (j === quiz.correct) it.style.borderColor = '#4caf50';
        if (j === i && !correct) it.style.borderColor = 'var(--coral)';
      });
      const feedback = el(`
        <div style="margin-top:16px;text-align:center;">
          <div style="font-size:14px;color:${correct ? '#4caf50' : 'var(--coral)'};font-weight:600;margin-bottom:12px;">
            ${correct ? '¡Correcto! 🌟' : 'Casi — la respuesta correcta está marcada en verde'}
          </div>
          <button class="cta" id="continueBtn">Continuar</button>
        </div>
      `);
      overlay.querySelector('.sheet').appendChild(feedback);
      overlay.querySelector('#continueBtn').onclick = () => {
        overlay.remove();
        proceedAfterQuiz(p, t, noteText, correct);
      };
    };
    optionsWrap.appendChild(btn);
  });
  document.body.appendChild(overlay);
}

  if (QUIZZES_HARD[t.id]) showHardQuizSheet(p, t, noteText, quizCorrect);
  else finishLearning(p, t, noteText, quizCorrect, null);
}
